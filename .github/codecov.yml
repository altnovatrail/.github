# Codecov's rules for the coverage of .github's own tests, which the coverage job of go.yml
# uploads. A Go profile names a file by its import path, which Codecov cuts down
# to the path in the repository by a default rule of its own.

coverage:
  status:
    # New and changed lines are covered at 90 % at least, and the ruleset of main requires the check.
    # A pull request that changes no line of the report, the documents alone,
    # passes as "Coverage not affected".
    patch:
      default:
        target: 90%
    # Codecov sets no project status for a public repository; should it ever set one, it
    # only informs.
    project:
      default:
        informational: true

# As spec's: a comment only when the coverage changes, with the diff and the files.
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
