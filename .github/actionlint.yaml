# What GitHub documents and actionlint does not know yet: concurrency's key queue; the
# properties job.workflow_ref, which release.yml signs under, and job.workflow_sha and
# job.workflow_repository, by which go.yml checks out the tool of its own version; and the self
# repository reference $/, by which go.yml takes the composite action of its own version (R18,
# R33, R49). Only those complaints, only in the workflows that use them, are waived.
paths:
  .github/workflows/self-release.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/release.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
      - 'property "workflow_ref" is not defined in object type'
  .github/workflows/go.yml:
    ignore:
      - 'property "workflow_repository" is not defined in object type'
      - 'property "workflow_sha" is not defined in object type'
      - 'specifying action "\$/\.github/actions/toolchain" in invalid format because ref is missing'
