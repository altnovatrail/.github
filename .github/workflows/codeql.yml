# Shared check (R03): CodeQL, as advanced setup, over the workflows of the repository that calls
# it — language actions, always — and over the languages it names (R30 in spec). The default
# setup of code scanning stays off: with it on, GitHub disables a workflow like this one.
#
# The caller's job gives it `contents: read` and `security-events: write`, which it needs to
# upload what it finds; a called workflow cannot raise what its caller gave. The check names are
# "<caller's job> / languages" and "<caller's job> / analyze (<language>)", one per language —
# CodeQL / languages and CodeQL / analyze (actions); the analyses hold the merge. Each language's
# results go up under a category of their own, /language:<language>, which stays the same
# whatever the caller's file or job is called. Paths the caller names are left out of the
# analysis of its languages — spec's draft/, a prototype a design tool built, say — while the
# analysis of actions reads every workflow, whatever the caller passes.
#
# Go is analysed from a build, with the caller's own Go: the one in the toolchain stage of its
# .devcontainer/Dockerfile, which its Go checks run with too (R16). A caller that names go installs
# Go there as spec's Dockerfile does, from go.dev's archive by ARG GO_VERSION, GO_SHA256_AMD64 and
# GO_SHA256_ARM64, and this workflow takes the same archive by them, without building the stage
# (R45). The build runs on the runner with the step's token, like any code a pull request brings
# into its own checks. paths-ignore does not reach it: CodeQL leaves paths out only of what it
# reads without a build.

name: CodeQL (shared)

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          The languages of the repository besides actions, which is always analysed, as CodeQL
          names them, divided by spaces, commas or lines: javascript-typescript and go are taken.
          Empty before there is code.
        type: string
        required: false
        default: ""
      paths-ignore:
        description: >-
          Paths CodeQL leaves out of the analysis of javascript-typescript — draft/**, say — as
          the paths-ignore of a CodeQL configuration: bare paths, one per line, unquoted. The
          analysis of actions never takes them and reads every workflow, and neither does that of
          go, which CodeQL reads from a build. A line that starts
          with # is a comment. Empty by default.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # actions and the languages the caller names, each once. Besides actions, javascript-typescript
  # and go are taken: the platform's code is Go and TypeScript (R03). Any other name stops the
  # check with its reason. This job is a check of its own, CodeQL / languages, and need not be
  # required: when it fails, the matrix never expands, the one check GitHub reports for it is a
  # skipped "analyze (${{ matrix.language }})", and the required analyses never come, so the merge
  # waits. This check says why. It also turns paths-ignore into the configuration that the
  # analyses of the caller's languages take.
  languages:
    name: languages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      config: ${{ steps.config.outputs.config }}
    steps:
      - id: list
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          IFS=$' \t\n,' read -r -d '' -a requested <<< "$LANGUAGES" || true
          list=(actions)
          for language in "${requested[@]}"; do
              case "$language" in
                  "" | actions) ;;
                  javascript-typescript | go)
                      [[ " ${list[*]} " == *" ${language} "* ]] || list+=("$language")
                      ;;
                  *)
                      echo "::error::CodeQL here takes, besides actions, javascript-typescript and go, not ${language}."
                      exit 1
                      ;;
              esac
          done
          matrix="$(printf '"%s",' "${list[@]}")"
          matrix="[${matrix%,}]"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "languages: ${matrix}"

      # One line of YAML, `paths-ignore: [...]`, with every path as a JSON string: YAML reads
      # those as double-quoted scalars, so a path that starts with * or holds a colon stays a
      # string. Blank lines, comment lines and the spaces around a path are dropped. A comma
      # anywhere, a # after a space or a tab, a leading "- " and a quote at either end stop the
      # check: in a block of lines each would end up inside one pattern, as a list, a comment
      # or quotes never meant as a path, and the path would match nothing. A control character
      # stops it too: it would break the YAML init parses. Without paths there is no
      # configuration, and init takes none.
      - id: config
        env:
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
        run: |
          paths=()
          while IFS= read -r path; do
              path="${path#"${path%%[![:space:]]*}"}"
              path="${path%"${path##*[![:space:]]}"}"
              [ -n "$path" ] || continue
              [[ "$path" == "#"* ]] && continue
              if [[ "$path" == *,* || "$path" == *[[:space:]]"#"* || "$path" == "- "* \
                  || "$path" == [\"\']* || "$path" == *[\"\'] ]]; then
                  echo "::error::paths-ignore takes bare paths, one per line, without commas, quotes, list marks or comments: ${path}"
                  exit 1
              fi
              if [[ "$path" == *[[:cntrl:]]* ]]; then
                  echo "::error::A path of paths-ignore holds a control character."
                  exit 1
              fi
              path="${path//\\/\\\\}"
              path="${path//\"/\\\"}"
              paths+=("\"${path}\"")
          done <<< "$PATHS_IGNORE"
          config=""
          if [ "${#paths[@]}" -gt 0 ]; then
              list="$(printf '%s, ' "${paths[@]}")"
              config="paths-ignore: [${list%, }]"
          fi
          echo "config=${config}" >> "$GITHUB_OUTPUT"
          echo "configuration: ${config:-none}"

  # build-mode none is what actions and javascript-typescript take, and go takes autobuild: CodeQL
  # reads Go only from a build, and with that mode the analyze step runs it itself. The queries are
  # security-extended, as canvas-api's (R50 canvas-api). tools: linked takes the CodeQL bundle
  # that this commit of the action ships with; without it, GitHub's flags choose the bundle at
  # run time. Only the analysis of javascript-typescript takes the caller's paths-ignore: that of
  # actions reads every workflow, as R09 keeps it, and that of go reads what the build compiled.
  # A green analysis says that CodeQL ran, not that it found nothing: what it found holds a merge
  # through the ruleset (architecture 3.1).
  analyze:
    name: analyze (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go of the caller's toolchain stage, without building the stage (R45): the archive of
      # go.dev that the stage installs, by the ARGs that pin it there, checked against the same
      # sum and unpacked onto the runner ahead of the runner's own Go. The ARGs are read from the
      # stage toolchain and the stages it is built from — FROM <stage> AS ... —, and from before the
      # first FROM, with comments dropped and continued lines joined, as Docker reads them: each
      # once, as ARG <name>=<value>. A Dockerfile that installs Go otherwise names none of them,
      # and the step stops, saying so. The image would hand the build its GO and CGO_ variables,
      # and those stages set none but GOTOOLCHAIN=local, which the step sets itself, to keep the
      # go command on this Go rather than on one a go.mod would have it fetch: one they set
      # besides, which the step cannot work out without the image, stops it too, by its name.
      - name: Go of the caller's toolchain stage
        if: matrix.language == 'go'
        run: |
          dockerfile=.devcontainer/Dockerfile
          stop() {
              echo "::error::$*"
              exit 1
          }
          [ -f "$dockerfile" ] || stop "CodeQL takes the Go of the toolchain stage of ${dockerfile}, and the repository has no ${dockerfile}."
          stages=$(sed -e '/^[[:space:]]*#/d' "$dockerfile" | sed -e ':a' -e '/\\$/N' -e 's/\\\n/ /' -e 'ta' | awk '
              BEGIN { stage = 0 }
              toupper($1) == "FROM" {
                  stage++
                  for (i = 2; i <= NF; i++) if ($i !~ /^--/) { image[stage] = tolower($i); break }
                  name[stage] = (NF >= 4 && toupper($(NF - 1)) == "AS") ? tolower($NF) : ""
              }
              { line[++count] = $0; of[count] = stage }
              END {
                  for (s = 1; s <= stage; s++) if (name[s] == "toolchain") at = s
                  if (!at) exit 3
                  keep[0] = 1
                  while (at) {
                      keep[at] = 1
                      from = image[at]
                      below = at
                      at = 0
                      for (s = 1; s < below; s++) if (name[s] == from) at = s
                  }
                  for (i = 1; i <= count; i++) if (keep[of[i]]) print line[i]
              }
          ') || stop "${dockerfile} has no stage toolchain, FROM ... AS toolchain."
          # The value of ARG $1=<value>, in value, if it matches $2, which $3 names.
          arg() {
              local count
              value=$(sed -n "s/^[[:space:]]*[Aa][Rr][Gg][[:space:]]\{1,\}$1=//p" <<< "$stages")
              count=0
              [ -z "$value" ] || count=$(wc -l <<< "$value")
              [ "$count" = 1 ] ||
                  stop "CodeQL takes Go by ARG GO_VERSION, GO_SHA256_AMD64 and GO_SHA256_ARM64 of the toolchain stage of ${dockerfile}, each once as ARG <name>=<value>, as spec's Dockerfile pins Go, and the stage and the stages it is built from have ARG $1=<value> ${count} times."
              [[ $value =~ $2 ]] || stop "ARG $1 of ${dockerfile} is ${value}, which is not $3."
          }
          while read -r instruction rest; do
              [ "${instruction^^}" = ENV ] || continue
              if [[ ${rest%%[[:space:]]*} == *=* ]]; then
                  names=$(grep -oE '(^|[[:space:]])[A-Za-z_][A-Za-z0-9_]*=' <<< "$rest" | tr -d ' \t=') || true
              else
                  names=${rest%%[[:space:]]*}
              fi
              for variable in $names; do
                  case $variable in
                      GOTOOLCHAIN) ;;
                      GO* | CGO_*) stop "The toolchain stage of ${dockerfile} sets ${variable}, which CodeQL's build would take from the image, and codeql.yml takes Go without building it: it sets GOTOOLCHAIN=local alone." ;;
                  esac
              done
          done <<< "$stages"
          case $RUNNER_ARCH in
              X64) arch=amd64 ;;
              ARM64) arch=arm64 ;;
              *) stop "CodeQL takes Go for a runner on X64 or ARM64, not on ${RUNNER_ARCH}." ;;
          esac
          arg GO_VERSION '^[0-9]+(\.[0-9]+)+((rc|beta)[0-9]+)?$' "a version of Go"
          version=$value
          arg "GO_SHA256_${arch^^}" '^[0-9a-f]{64}$' "a sha256 in hexadecimal"
          sum=$value
          url="https://go.dev/dl/go${version}.linux-${arch}.tar.gz"
          archive="$RUNNER_TEMP/go${version}.linux-${arch}.tar.gz"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors -o "$archive" "$url" ||
              stop "go.dev gave no ${url}."
          actual=$(sha256sum < "$archive")
          actual=${actual%% *}
          [ "$actual" = "$sum" ] ||
              stop "The sha256 of ${url} is ${actual}, and ARG GO_SHA256_${arch^^} of ${dockerfile} is ${sum}."
          tar -C "$RUNNER_TEMP" -xzf "$archive"
          rm -f -- "$archive"
          reported=$(GOTOOLCHAIN=local "$RUNNER_TEMP/go/bin/go" version)
          [ "$reported" = "go version go${version} linux/${arch}" ] ||
              stop "The Go of ${url} says \"${reported}\", not go${version} linux/${arch}."
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "$reported"

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          tools: linked
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended
          config: ${{ matrix.language == 'javascript-typescript' && needs.languages.outputs.config || '' }}

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
