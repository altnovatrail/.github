# Shared check: CodeQL, as advanced setup, over the caller's workflows — language actions,
# always — and over the languages it names. The default setup of code scanning stays
# off: with it on, GitHub disables a workflow like this one.
#
# The caller's job gives it `contents: read` and `security-events: write`: a called workflow
# cannot raise what its caller gave. The checks are "<caller's job> / languages" and
# "<caller's job> / analyze (<language>)"; the analyses hold the merge. Each language's results go
# up under the category /language:<language>, the same whatever the caller's file or job is called.
#
# Go is analysed from a build, with the Go of the caller's toolchain stage, which its Go checks run
# with too, taken without building the stage. The build runs on the runner with the
# step's token, like any code a pull request brings into its own checks.

name: CodeQL (shared)

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          The languages of the repository besides actions, which is always analysed, as CodeQL
          names them, divided by spaces, commas or lines: javascript-typescript and go are taken.
          Empty before there is code.
        type: string
        required: false
        default: ""
      paths-ignore:
        description: >-
          Paths CodeQL leaves out of the analysis of javascript-typescript — draft/**, say — as
          the paths-ignore of a CodeQL configuration: bare paths, one per line, unquoted. The
          analysis of actions never takes them and reads every workflow, and neither does that of
          go, which CodeQL reads from a build. A line that starts
          with # is a comment. Empty by default.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Besides actions, javascript-typescript and go are taken: the platform's code is Go and
  # TypeScript. Any other name stops the check with its reason. The job also turns
  # paths-ignore into the configuration the analyses of the caller's languages take. It is a check
  # of its own and need not be required: when it fails, the matrix never expands, the one check
  # GitHub reports for it is a skipped "analyze (${{ matrix.language }})", the required analyses
  # never come, and the merge waits; this check says why.
  languages:
    name: languages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      config: ${{ steps.config.outputs.config }}
    steps:
      - id: list
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          IFS=$' \t\n,' read -r -d '' -a requested <<< "$LANGUAGES" || true
          list=(actions)
          for language in "${requested[@]}"; do
              case "$language" in
                  "" | actions) ;;
                  javascript-typescript | go)
                      [[ " ${list[*]} " == *" ${language} "* ]] || list+=("$language")
                      ;;
                  *)
                      echo "::error::CodeQL here takes, besides actions, javascript-typescript and go, not ${language}."
                      exit 1
                      ;;
              esac
          done
          matrix="$(printf '"%s",' "${list[@]}")"
          matrix="[${matrix%,}]"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "languages: ${matrix}"

      # Every path as a JSON string, which YAML reads as a double-quoted scalar, so a path that
      # starts with * or holds a colon stays a string. A comma, a # after a blank, a leading "- "
      # or a quote at either end would end up inside the pattern and match nothing, and a control
      # character would break the YAML init parses: each stops the check.
      - id: config
        env:
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
        run: |
          paths=()
          while IFS= read -r path; do
              path="${path#"${path%%[![:space:]]*}"}"
              path="${path%"${path##*[![:space:]]}"}"
              [ -n "$path" ] || continue
              [[ "$path" == "#"* ]] && continue
              if [[ "$path" == *,* || "$path" == *[[:space:]]"#"* || "$path" == "- "* \
                  || "$path" == [\"\']* || "$path" == *[\"\'] ]]; then
                  echo "::error::paths-ignore takes bare paths, one per line, without commas, quotes, list marks or comments: ${path}"
                  exit 1
              fi
              if [[ "$path" == *[[:cntrl:]]* ]]; then
                  echo "::error::A path of paths-ignore holds a control character."
                  exit 1
              fi
              path="${path//\\/\\\\}"
              path="${path//\"/\\\"}"
              paths+=("\"${path}\"")
          done <<< "$PATHS_IGNORE"
          config=""
          if [ "${#paths[@]}" -gt 0 ]; then
              list="$(printf '%s, ' "${paths[@]}")"
              config="paths-ignore: [${list%, }]"
          fi
          echo "config=${config}" >> "$GITHUB_OUTPUT"
          echo "configuration: ${config:-none}"

  # Go takes autobuild: CodeQL reads Go only from a build. tools: linked takes the bundle this
  # commit of the action ships with; without it, GitHub's flags choose the bundle at run time. Only
  # javascript-typescript takes paths-ignore: actions reads every workflow, and go what the
  # build compiled. A green analysis says that CodeQL ran, not that it found nothing: what it found
  # holds a merge through the ruleset.
  analyze:
    name: analyze (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go of the caller's toolchain stage without building the stage: go.dev's archive
      # by the stage's ARG GO_VERSION and GO_SHA256_AMD64 — the job runs on X64 —, each once in the
      # stage or a stage it is built from, where Docker reads them. The Dockerfile is read as
      # Docker's parser reads it, with \ as its escape character. The build would take from the
      # image the GO and CGO_ variables its stages set: one other than GOTOOLCHAIN=local, which the
      # step sets itself, cannot be worked out without the image and stops the step; what the base
      # image sets, the step does not see.
      - name: Go of the caller's toolchain stage
        if: matrix.language == 'go'
        run: |
          dockerfile=.devcontainer/Dockerfile
          stop() {
              echo "::error::$*"
              exit 1
          }
          [ -f "$dockerfile" ] || stop "CodeQL takes the Go of the toolchain stage of ${dockerfile}, and the repository has no ${dockerfile}."
          [ "$RUNNER_ARCH" = X64 ] || stop "CodeQL takes the archive of Go for X64, and the runner is ${RUNNER_ARCH}."
          # Parser directives, # <name>=<value>, come only before anything else.
          while IFS= read -r line; do
              [[ $line =~ ^#[[:space:]]*([A-Za-z][A-Za-z0-9]*)[[:space:]]*=[[:space:]]*([^[:space:]]*) ]] || break
              if [ "${BASH_REMATCH[1],,}" = escape ] && [ "${BASH_REMATCH[2]}" != "\\" ]; then
                  stop "${dockerfile} sets another escape character than \\, and CodeQL reads its continued lines by \\."
              fi
          done < "$dockerfile"
          stages=$(sed -e 's/[[:space:]]*$//' -e '/^[[:space:]]*#/d' -e '/^$/d' "$dockerfile" |
              sed -e ':a' -e '/\\$/N' -e 's/\\\n/ /' -e 'ta' | awk '
              toupper($1) == "FROM" {
                  stage++
                  for (i = 2; i <= NF; i++) if ($i !~ /^--/) { image[stage] = tolower($i); break }
                  name[stage] = (NF >= 4 && toupper($(NF - 1)) == "AS") ? tolower($NF) : ""
              }
              stage { line[++count] = $0; of[count] = stage }
              END {
                  for (s = 1; s <= stage; s++) if (name[s] == "toolchain") at = s
                  if (!at) exit 3
                  while (at) {
                      keep[at] = 1
                      from = image[at]
                      below = at
                      at = 0
                      for (s = 1; s < below; s++) if (name[s] == from) at = s
                  }
                  for (i = 1; i <= count; i++) if (keep[of[i]]) print line[i]
              }
          ') || stop "${dockerfile} has no stage toolchain, FROM ... AS toolchain."
          # The value of ARG $1=<value>, in value, if it matches $2, which $3 names.
          arg() {
              local count
              value=$(sed -n "s/^[[:space:]]*[Aa][Rr][Gg][[:space:]]\{1,\}$1=//p" <<< "$stages")
              count=0
              [ -z "$value" ] || count=$(wc -l <<< "$value")
              [ "$count" = 1 ] ||
                  stop "CodeQL takes Go by ARG GO_VERSION and GO_SHA256_AMD64 of the toolchain stage of ${dockerfile}, each once as ARG <name>=<value>, as spec's Dockerfile pins Go, and the stage and the stages it is built from have ARG $1=<value> ${count} times."
              [[ $value =~ $2 ]] || stop "ARG $1 of ${dockerfile} is ${value}, which is not $3."
          }
          while read -r instruction rest; do
              [ "${instruction^^}" = ENV ] || continue
              if [[ ${rest%%[[:space:]]*} == *=* ]]; then
                  names=$(grep -oE '(^|[[:space:]])[A-Za-z_][A-Za-z0-9_]*=' <<< "$rest" | tr -d ' \t=') || true
              else
                  names=${rest%%[[:space:]]*}
              fi
              for variable in $names; do
                  case $variable in
                      GOTOOLCHAIN) ;;
                      GO* | CGO_*) stop "The toolchain stage of ${dockerfile} sets ${variable}, which CodeQL's build would take from the image, and codeql.yml takes Go without building it: it sets GOTOOLCHAIN=local alone." ;;
                  esac
              done
          done <<< "$stages"
          arg GO_VERSION '^[0-9]+(\.[0-9]+)+((rc|beta)[0-9]+)?$' "a version of Go"
          version=$value
          arg GO_SHA256_AMD64 '^[0-9a-f]{64}$' "a sha256 in hexadecimal"
          sum=$value
          url="https://go.dev/dl/go${version}.linux-amd64.tar.gz"
          archive="$RUNNER_TEMP/go${version}.linux-amd64.tar.gz"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors -o "$archive" "$url" ||
              stop "go.dev gave no ${url}."
          actual=$(sha256sum < "$archive")
          actual=${actual%% *}
          [ "$actual" = "$sum" ] ||
              stop "The sha256 of ${url} is ${actual}, and ARG GO_SHA256_AMD64 of ${dockerfile} is ${sum}."
          tar -C "$RUNNER_TEMP" -xzf "$archive" || stop "${url} does not unpack."
          rm -f -- "$archive"
          reported=$(GOTOOLCHAIN=local "$RUNNER_TEMP/go/bin/go" version) || stop "The Go of ${url} does not run."
          [ "$reported" = "go version go${version} linux/amd64" ] ||
              stop "The Go of ${url} says \"${reported}\", not go${version} linux/amd64."
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "$reported"

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          tools: linked
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended
          config: ${{ matrix.language == 'javascript-typescript' && needs.languages.outputs.config || '' }}

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
