# Shared check (R03): CodeQL, as advanced setup, over the workflows of the repository that calls
# it — language actions, always — and over the languages it names (R30 in spec). The default
# setup of code scanning stays off: with it on, GitHub disables a workflow like this one.
#
# The caller's job gives it `contents: read` and `security-events: write`, which it needs to
# upload what it finds; a called workflow cannot raise what its caller gave. The check names are
# "<caller's job> / languages" and "<caller's job> / analyze (<language>)", one per language —
# CodeQL / languages and CodeQL / analyze (actions); the analyses hold the merge. Each language's
# results go up under a category of their own, /language:<language>, which stays the same
# whatever the caller's file or job is called. Paths the caller names are left out of the
# analysis of its languages — spec's draft/, a prototype a design tool built, say — while the
# analysis of actions reads every workflow, whatever the caller passes.
#
# Go is analysed from a build, with the caller's own Go: the one in the toolchain stage of its
# .devcontainer/Dockerfile, which its Go checks run with too (R16). A caller that names go needs
# Go there, in /usr/local/go. The build runs on the runner with the step's token, like any code a
# pull request brings into its own checks. paths-ignore does not reach it: CodeQL leaves paths
# out only of what it reads without a build.

name: CodeQL (shared)

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          The languages of the repository besides actions, which is always analysed, as CodeQL
          names them, divided by spaces, commas or lines: javascript-typescript and go are taken.
          Empty before there is code.
        type: string
        required: false
        default: ""
      paths-ignore:
        description: >-
          Paths CodeQL leaves out of the analysis of javascript-typescript — draft/**, say — as
          the paths-ignore of a CodeQL configuration: bare paths, one per line, unquoted. The
          analysis of actions never takes them and reads every workflow, and neither does that of
          go, which CodeQL reads from a build. A line that starts
          with # is a comment. Empty by default.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # actions and the languages the caller names, each once. Besides actions, javascript-typescript
  # and go are taken: the platform's code is Go and TypeScript (R03). Any other name stops the
  # check with its reason. This job is a check of its own, CodeQL / languages, and need not be
  # required: when it fails, the matrix never expands, the one check GitHub reports for it is a
  # skipped "analyze (${{ matrix.language }})", and the required analyses never come, so the merge
  # waits. This check says why. It also turns paths-ignore into the configuration that the
  # analyses of the caller's languages take.
  languages:
    name: languages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      config: ${{ steps.config.outputs.config }}
    steps:
      - id: list
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          IFS=$' \t\n,' read -r -d '' -a requested <<< "$LANGUAGES" || true
          list=(actions)
          for language in "${requested[@]}"; do
              case "$language" in
                  "" | actions) ;;
                  javascript-typescript | go)
                      [[ " ${list[*]} " == *" ${language} "* ]] || list+=("$language")
                      ;;
                  *)
                      echo "::error::CodeQL here takes, besides actions, javascript-typescript and go, not ${language}."
                      exit 1
                      ;;
              esac
          done
          matrix="$(printf '"%s",' "${list[@]}")"
          matrix="[${matrix%,}]"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "languages: ${matrix}"

      # One line of YAML, `paths-ignore: [...]`, with every path as a JSON string: YAML reads
      # those as double-quoted scalars, so a path that starts with * or holds a colon stays a
      # string. Blank lines, comment lines and the spaces around a path are dropped. A comma
      # anywhere, a # after a space or a tab, a leading "- " and a quote at either end stop the
      # check: in a block of lines each would end up inside one pattern, as a list, a comment
      # or quotes never meant as a path, and the path would match nothing. A control character
      # stops it too: it would break the YAML init parses. Without paths there is no
      # configuration, and init takes none.
      - id: config
        env:
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
        run: |
          paths=()
          while IFS= read -r path; do
              path="${path#"${path%%[![:space:]]*}"}"
              path="${path%"${path##*[![:space:]]}"}"
              [ -n "$path" ] || continue
              [[ "$path" == "#"* ]] && continue
              if [[ "$path" == *,* || "$path" == *[[:space:]]"#"* || "$path" == "- "* \
                  || "$path" == [\"\']* || "$path" == *[\"\'] ]]; then
                  echo "::error::paths-ignore takes bare paths, one per line, without commas, quotes, list marks or comments: ${path}"
                  exit 1
              fi
              if [[ "$path" == *[[:cntrl:]]* ]]; then
                  echo "::error::A path of paths-ignore holds a control character."
                  exit 1
              fi
              path="${path//\\/\\\\}"
              path="${path//\"/\\\"}"
              paths+=("\"${path}\"")
          done <<< "$PATHS_IGNORE"
          config=""
          if [ "${#paths[@]}" -gt 0 ]; then
              list="$(printf '%s, ' "${paths[@]}")"
              config="paths-ignore: [${list%, }]"
          fi
          echo "config=${config}" >> "$GITHUB_OUTPUT"
          echo "configuration: ${config:-none}"

  # build-mode none is what actions and javascript-typescript take, and go takes autobuild: CodeQL
  # reads Go only from a build, and with that mode the analyze step runs it itself. The queries are
  # security-extended, as canvas-api's (R50 canvas-api). tools: linked takes the CodeQL bundle
  # that this commit of the action ships with; without it, GitHub's flags choose the bundle at
  # run time. Only the analysis of javascript-typescript takes the caller's paths-ignore: that of
  # actions reads every workflow, as R09 keeps it, and that of go reads what the build compiled.
  # A green analysis says that CodeQL ran, not that it found nothing: what it found holds a merge
  # through the ruleset (architecture 3.1).
  analyze:
    name: analyze (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go of the caller's toolchain stage, copied out of that image onto the runner ahead of
      # the runner's own: the version the caller pins, from the archive its Dockerfile checked
      # against its sum, followed if /usr/local/go is a link. The image's GO and CGO_ variables
      # come along, and GOTOOLCHAIN=local keeps the go command on this Go rather than on one a
      # go.mod would have it fetch. The Dockerfile copies nothing from the repository, so it is
      # built without a context, as documents.yml and go.yml build it.
      - name: Go of the caller's toolchain stage
        if: matrix.language == 'go'
        run: |
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          container=$(docker create toolchain true)
          docker cp -L "$container:/usr/local/go" "$RUNNER_TEMP/go"
          docker rm "$container" > /dev/null
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' toolchain \
              | grep -E '^(GO|CGO_)[A-Z0-9_]*=' | grep -v '^GOTOOLCHAIN=' >> "$GITHUB_ENV" || true
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/go/bin/go" version

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          tools: linked
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended
          config: ${{ matrix.language == 'javascript-typescript' && needs.languages.outputs.config || '' }}

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
