# Shared check (R03): no secret anywhere in the history of the repository that calls it.
# gitleaks runs as its own binary, not as gitleaks-action, whose licence is not open source (R30
# in spec). The version and the archive's SHA-256 are here, in the workflow itself (R08): a new
# version is a change to this file, and so a new release of .github (R04).
#
# Called from a job of the caller's CI, which gives it `contents: read`. The caller's own
# allowlist, if it has one, is .gitleaks.toml at its root, with .gitleaksignore beside it. A
# pull request cannot loosen the scan of its own commits: on pull_request both files are taken
# from the base the pull request is merged into, and inline gitleaks:allow comments count for
# nothing. On main they are the commit's own, which went through review as a pull request. A
# .gitleaks.toml replaces gitleaks' rules unless it extends them, so it has to say `[extend]`
# `useDefault = true`, and the check stops on one that does not.

name: Secrets (shared)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The whole history: a secret removed in a later commit is still in the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The archive is checked against its SHA-256 from gitleaks_8.30.1_checksums.txt before it is
      # unpacked: the release has no signature of its own.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$archive" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xzf "$archive" gitleaks

      # The allowlist goes to a folder of its own, and gitleaks reads it only from there: a
      # .gitleaks.toml or .gitleaksignore that only the pull request brings is not read. With no
      # .gitleaks.toml, the rules are gitleaks' defaults.
      - name: The allowlist
        run: |
          source=HEAD
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
              source='HEAD^1'
          fi
          config="$RUNNER_TEMP/gitleaks-config"
          mkdir -p "$config"
          if git cat-file -e "${source}:.gitleaks.toml" 2> /dev/null; then
              git show "${source}:.gitleaks.toml" > "$config/gitleaks.toml"
              if ! grep -Eq '^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true' "$config/gitleaks.toml"; then
                  echo "::error::.gitleaks.toml replaces gitleaks' default rules unless it extends them: give it [extend] with useDefault = true."
                  exit 1
              fi
          else
              printf '[extend]\nuseDefault = true\n' > "$config/gitleaks.toml"
          fi
          if git cat-file -e "${source}:.gitleaksignore" 2> /dev/null; then
              git show "${source}:.gitleaksignore" > "$config/.gitleaksignore"
          fi
          echo "allowlist from ${source}"

      # The history of the commit under test, HEAD: on its own gitleaks reads every branch it
      # finds, and a stray branch would turn every run red. Every finding is named — rule, file,
      # line, commit — with its value redacted.
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts=HEAD \
              --config="$RUNNER_TEMP/gitleaks-config/gitleaks.toml" \
              --gitleaks-ignore-path="$RUNNER_TEMP/gitleaks-config" \
              --ignore-gitleaks-allow .
