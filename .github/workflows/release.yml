# Shared release (R03, R18): what a green main of a repository with code produces — the files its
# own recipe builds, each signed without a key, and the tag created with the release, as spec's
# release creates its own (R31 in spec). Nobody tags by hand: the version is the next patch of the
# line the caller's release workflow sets, RELEASE_LINE, worked out by spec's own recipe, as
# .github's release works out its own (R14). Module packages are files like any other and are
# signed the same way (R17 in spec).
#
# A commit gets a release only when a path the caller names in paths has changed since the
# release before it; the first release comes out always. A library would otherwise bring every
# repository that imports it a new tag for a change of its documents alone.
#
# The signature is cosign's, keyless. Its certificate names this workflow, at the ref the caller
# pins, as what signed, and the caller's repository and workflow as the run that signed
# (architecture 2.3). What a consumer checks of it is Т-27, which T37 in spec decides.
#
# With npm-package, the release also publishes that package to npm, in the @altnovatrail scope:
# the archive npm pack names for it, one of the files the run signs and puts in the release, the
# same bytes (R37 in spec). npm takes it by trusted publishing, with no token kept anywhere: the
# registry trusts the caller's release workflow by its file name, as the package's trusted
# publisher names it, and npm gets a short-lived token by the job's OIDC. The first version of a
# package is published by hand, since a trusted publisher is set on a package the registry has.
#
# The caller's release workflow runs on the workflow_run of its CI and on the button, gives this
# job contents: write, id-token: write and actions: read, and sets RELEASE_LINE in its own env.
# Its repository keeps its releases immutable and its tags v* under a ruleset (architecture 3.3),
# and its spec submodule is at v0.2.17 or newer: spec's recipes run by the script that spec ships
# from that tag (R31 in spec).
# With publish: false a run builds, signs and checks the signatures and publishes nothing, which
# lets a pull request try a change here.

name: Release (shared)

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          What the release is built from, as git pathspecs, one per line: cmd/**, go.mod, say.
          A commit that changes none of them since the release before it gets no release.
        type: string
        required: true
      publish:
        description: >-
          false builds the files, signs them and checks the signatures, and publishes nothing.
        type: boolean
        required: false
        default: true
      npm-package:
        description: >-
          The npm package the release also publishes, by its name in the @altnovatrail scope:
          @altnovatrail/canvas, say, whose archive among the files is altnovatrail-canvas-X.Y.Z.tgz,
          as npm pack names it. Empty publishes nothing to npm.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    name: release
    # Releases queue rather than overlap: each has to see the version the one before it
    # published before it can work out the next. queue: max keeps up to 100 runs pending
    # (GitHub Docs, Workflow syntax, concurrency, read 2026-10-20); actionlint does not know the
    # key yet: .github/actionlint.yaml. A trial queues apart, by its ref, and does not hold up a
    # release; the calling job sets no concurrency of its own, or the two would wait on each other.
    concurrency:
      group: ${{ inputs.publish && 'release' || format('release-trial-{0}', github.ref) }}
      cancel-in-progress: false
      queue: max
    # Only from a commit the checks have passed on, and only when that commit is the caller's
    # own: the branch filter of a workflow_run matches the name of a fork's branch as well. A run
    # that publishes nothing may run anywhere: a pull request tries a change that way.
    if: >-
      inputs.publish == false ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # bash with pipefail, as in .github's own release.
    defaults:
      run:
        shell: bash
    # The commit the checks ran on, which this run releases: the commit of the CI run, or the
    # commit of the event otherwise. The checkout below is the tip, and TARGET is named by its SHA
    # alone (R12).
    env:
      TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      # Creating the release and uploading what it holds.
      contents: write
      # The short-lived identity the signature is made with: no key is kept anywhere.
      id-token: write
      # Reading whether CI passed on the commit the button would release.
      actions: read
    steps:
      # The npm package the caller names is checked on every run, whether or not it releases: a
      # name of the @altnovatrail scope and no other (R37 in spec). Its archive is named as npm pack
      # names it, the scope and the name joined by a dash, then the version: the steps below take
      # that stem from here.
      - id: npm-name
        name: The npm package's name
        if: inputs.npm-package != ''
        env:
          NPM_PACKAGE: ${{ inputs.npm-package }}
        run: |
          if ! [[ "$NPM_PACKAGE" =~ ^@altnovatrail/[a-z0-9][a-z0-9._-]*$ ]]; then
              echo "::error::npm-package is \"${NPM_PACKAGE}\", which is no package of the @altnovatrail scope, as @altnovatrail/canvas is (R37 in spec)."
              exit 1
          fi
          name="${NPM_PACKAGE#@}"
          echo "stem=${name/\//-}" >> "$GITHUB_OUTPUT"

      # Asked before anything of the repository is fetched: a run on another branch publishes
      # nothing, and neither does a commit whose CI on main has not finished green. The caller's
      # CI is ci.yml, as architecture 3.3 has it.
      - name: Whether this commit may be released by hand
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release is published from main alone, and this run is on ${GITHUB_REF}."
              exit 1
          fi
          passed=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f status=success \
              --jq '.total_count')
          if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed on ${GITHUB_SHA}. A release waits for its checks, and follows them by itself once they pass."
              exit 1
          fi

      # The tip the event saw, with every tag, and spec as its submodule: the toolchain stage of
      # the tip and spec's recipes work out the number. TARGET, the commit the checks ran on, is
      # in its history and is named by its SHA alone; what is built is TARGET's own tree (below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      # As .github's own release works it out (R14): spec's release-version, run in the toolchain
      # stage, handed TARGET and the caller's release workflow — the file github.workflow_ref
      # names, since the github context of a called workflow is the caller's — whose RELEASE_LINE
      # at TARGET is the line. release-refusal runs only after a refusal, so just's dry run asks
      # here whether the publish step's call of it still parses. A commit whose change touches
      # none of the caller's paths since the release before it gets no release; a tag with no
      # release behind it was pushed by hand and stops the run.
      #
      # The recipes run by spec's own script, tools/toolchain/toolchain.sh in the caller's spec
      # submodule, at the tag it pins (R31 in spec). The script itself runs on the runner, in this
      # step's environment and the job's, where the caller's own code runs in a container with no
      # token (R18). So the run first asks that spec/ be a submodule of altnovatrail/spec, checked
      # out at the commit the caller pins and at a tag of spec — every NovaTrail repository pins
      # spec at an exact tag (RULES.md) — and that the tag hold the script, which spec ships from
      # v0.2.17; anything else stops it before anything is built, with the reason. A run of a
      # commit older than the tip leaves before that, without a release, as it always has.
      #
      # Every container the script starts has the folder it runs from mounted read-write, .git and
      # all, so the script runs from a copy of the checkout, in RUNNER_TEMP. The runner's own git
      # reads the checkout alone, which no container mounts: the diff below, the archive the next
      # step builds and signs, the fetch after a refusal and the post step of actions/checkout.
      # Containers may change the copy, so the script's sum is taken in the checkout and checked
      # in the copy before each call after a container: what runs on the runner is the script the
      # tag holds.
      - id: version
        name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          PATHS: ${{ inputs.paths }}
        run: |
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The commit to release is not a full SHA: \"${TARGET}\"."
              exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              echo "::error::A shallow clone has no tags to count from: fetch the whole history."
              exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET" HEAD; then
              echo "::error::${TARGET} is not in the history of the checkout, $(git rev-parse HEAD)."
              exit 1
          fi
          # The certificate names the commit of the run, GITHUB_SHA, as its source, so only that
          # commit is signed: a release whose signature names another commit than its tag would
          # not check. A commit whose CI ended after a newer one's gets none; the newer one's
          # release covers it.
          if [ "$TARGET" != "$GITHUB_SHA" ]; then
              echo "::notice::${TARGET} is older than the tip this run signs as, ${GITHUB_SHA}: the tip's release covers it."
              {
                  echo "version="
                  echo "previous="
                  echo "released="
              } >> "$GITHUB_OUTPUT"
              exit 0
          fi
          workflow="${CALLER_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}"
          workflow="${workflow%@*}"
          if [[ "$workflow" != .github/workflows/* ]]; then
              echo "::error::The caller's workflow is not a file of .github/workflows/: ${CALLER_WORKFLOW_REF}."
              exit 1
          fi
          paths=()
          while IFS= read -r path; do
              path="${path#"${path%%[![:space:]]*}"}"
              path="${path%"${path##*[![:space:]]}"}"
              [ -n "$path" ] && paths+=("$path")
          done <<< "$PATHS"
          if [ "${#paths[@]}" = 0 ]; then
              echo "::error::paths names nothing the release is built from."
              exit 1
          fi
          url=$(git config --file .gitmodules --get submodule.spec.url) || url=""
          case "$url" in
              https://github.com/altnovatrail/spec.git | https://github.com/altnovatrail/spec) ;;
              *)
                  echo "::error::.gitmodules gives the spec submodule the URL \"${url}\", not https://github.com/altnovatrail/spec.git: spec's recipes run from spec alone."
                  exit 1
                  ;;
          esac
          if [[ "$(git submodule status -- spec 2> /dev/null)" != " "* ]]; then
              echo "::error::spec/ is not checked out at the commit this commit pins it to."
              exit 1
          fi
          tags=$(git -C spec tag --points-at HEAD --list 'v*')
          tag=${tags%%$'\n'*}
          if [ -z "$tag" ]; then
              echo "::error::The spec submodule is pinned at $(git -C spec rev-parse --short=12 HEAD), which is no tag of spec: pin it at a tag, v0.2.17 or newer, as every NovaTrail repository pins spec."
              exit 1
          fi
          if [ ! -f spec/tools/toolchain/toolchain.sh ] || [ ! -x spec/tools/toolchain/toolchain.sh ]; then
              echo "::error::spec ${tag} has no executable tools/toolchain/toolchain.sh. This release runs spec's recipes by that script, which spec ships from v0.2.17 (R31 in spec): move spec/ to v0.2.17 or newer, then run the release again."
              exit 1
          fi
          toolchain_sum=$(sha256sum spec/tools/toolchain/toolchain.sh)
          cp -a . "$RUNNER_TEMP/checkout"
          (
              cd "$RUNNER_TEMP/checkout"
              spec/tools/toolchain/toolchain.sh build
              if ! spec/tools/toolchain/toolchain.sh spec --dry-run release-refusal \
                  "$TARGET" "$TARGET" "$RUNNER_TEMP/release-create.err" 2> "$RUNNER_TEMP/release-refusal"; then
                  cat "$RUNNER_TEMP/release-refusal" >&2
                  echo "::error::The dry run of spec's release-refusal, with the arguments the publish step gives it — the commit, the tip and the error file — failed; the lines above say why. A tag of spec whose recipe is gone or takes other arguments fails it."
                  exit 1
              fi
              if ! printf '%s\n' "$toolchain_sum" | sha256sum --check --strict --status; then
                  echo "::error::spec/tools/toolchain/toolchain.sh changed in the copy of the checkout while the release ran: something a container ran wrote into the copy. Nothing more runs from it."
                  exit 1
              fi
              spec/tools/toolchain/toolchain.sh spec release-version "$TARGET" "$workflow" \
                  > "$RUNNER_TEMP/release-version"
          )
          cat "$RUNNER_TEMP/release-version"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release-version")
          previous=$(sed -n 's/^previous=//p' "$RUNNER_TEMP/release-version")
          released=$(sed -n 's/^released=//p' "$RUNNER_TEMP/release-version")
          behind=$(sed -n 's/^behind=//p' "$RUNNER_TEMP/release-version")
          for tag in $released $behind $previous; do
              if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null; then
                  echo "::error::${tag} has no release behind it: a tag pushed by hand. Tags come from the release workflow alone."
                  exit 1
              fi
          done
          # git diff --quiet exits 1 on a change and 0 on none; anything else is its own failure.
          if [ -n "$version" ] && [ -n "$previous" ]; then
              changed=0
              git diff --quiet "$previous" "$TARGET" -- "${paths[@]}" || changed=$?
              if [ "$changed" = 0 ]; then
                  echo "::notice::Nothing the release is built from has changed since ${previous}: nothing to release."
                  version=""
              elif [ "$changed" != 1 ]; then
                  echo "::error::git diff could not compare ${previous} with ${TARGET}."
                  exit 1
              fi
          fi
          if [ -n "$version" ]; then
              echo "releasing $version at $TARGET"
          elif [ -n "$released" ] || [ -n "$behind" ]; then
              echo "::notice::Nothing to publish: ${TARGET} is released already, or is older than the newest release."
          fi
          {
              echo "version=${version}"
              echo "previous=${previous}"
              echo "released=${released}"
          } >> "$GITHUB_OUTPUT"

      # TARGET's own tree, without its history, its submodules or what .gitattributes keeps out of
      # an archive, and its own toolchain stage: what is built is the commit the checks passed on,
      # with the Go and tools it pins. The caller's release-files recipe gets the version, has no
      # git to ask, and writes the files into dist/: plain files, named with letters, digits, dots,
      # dashes, pluses and underscores, none a bundle of its own. Nothing of the step's
      # environment, no token among it, goes into the container. The step builds and runs the
      # stage itself rather than by spec's script: the caller's own code sees its tree alone and no
      # token, whatever a later tag of the script comes to mount or hand in (R18).
      - name: Build the files
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tree="$RUNNER_TEMP/tree"
          mkdir "$tree"
          git archive "$TARGET" | tar -x -C "$tree"
          docker build --target toolchain --tag release-toolchain - < "$tree/.devcontainer/Dockerfile"
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$tree:/work" \
              --workdir /work release-toolchain just release-files "$VERSION"
          if [ -L "$tree/dist" ] || [ ! -d "$tree/dist" ] || [ -z "$(ls -A "$tree/dist")" ]; then
              echo "::error::release-files wrote nothing into dist/, or dist/ is a link."
              exit 1
          fi
          if find "$tree/dist" -mindepth 1 ! -type f | grep -q .; then
              echo "::error::dist/ holds something besides files: a release takes files alone."
              exit 1
          fi
          for path in "$tree"/dist/*; do
              name="${path##*/}"
              if ! [[ "$name" =~ ^[A-Za-z0-9_+][A-Za-z0-9._+-]*$ ]] || [[ "$name" == *.sigstore.json ]]; then
                  echo "::error::A file of dist/ is named ${name}: names take letters, digits, . _ + -, and a bundle .sigstore.json is the release's own."
                  exit 1
              fi
          done
          mv "$tree/dist" "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"

      # cosign at an exact version, checked against the sum in cosign_checksums.txt of its
      # release, as gitleaks is (R08). Signing needs it, and so does a run again that takes the npm
      # package from a release to publish it.
      - name: cosign
        if: >-
          steps.version.outputs.version != '' ||
          (inputs.npm-package != '' && inputs.publish && steps.version.outputs.released != '')
        env:
          COSIGN_VERSION: "3.1.4"
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          cosign="$RUNNER_TEMP/cosign"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$cosign" \
              "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${cosign}" | sha256sum --check --strict
          chmod +x "$cosign"

      # Node at an exact version, with the npm it ships, checked against the sum in SHASUMS256.txt
      # of its release, as cosign is (R08): 24.22.1, the newest security release of Node 24 when
      # T27 was written, with npm 11.19.1. Trusted publishing takes npm 11.5.1 and Node 22.14.0 or
      # newer (R37 in spec). npm runs on the runner, not in the caller's toolchain stage, which gets
      # no token (R18).
      #
      # npm-isolated, which the check and the publish below both run, is npm kept from every
      # setting this workflow did not choose: from an empty folder, so no package.json or .npmrc
      # of a project is read; with no user or global config and no npm_config_ variables,
      # NODE_OPTIONS or NPM_ID_TOKEN; with the registry named on its command line, which no
      # publishConfig overrides; and with no scripts. That guards against stray settings, not
      # against code that ran on the runner before (В23 in RUN.md). No container runs after this
      # step, so nothing but this workflow writes the script.
      - name: Node and npm
        if: >-
          inputs.npm-package != '' &&
          (steps.version.outputs.version != '' || (inputs.publish && steps.version.outputs.released != ''))
        env:
          NODE_VERSION: "24.22.1"
          NODE_SHA256: 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6
        run: |
          archive="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$archive" \
              "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/node"
          tar -C "$RUNNER_TEMP/node" --strip-components=1 -xJf "$archive"
          "$RUNNER_TEMP/node/bin/node" --version
          jq -r '"npm " + .version' "$RUNNER_TEMP/node/lib/node_modules/npm/package.json"
          cat > "$RUNNER_TEMP/npm-isolated" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          unset NODE_OPTIONS NPM_ID_TOKEN
          for variable in $(compgen -e); do
              case "${variable,,}" in npm_config_*) unset "$variable" ;; esac
          done
          work="$RUNNER_TEMP/npm"
          mkdir -p "$work"
          cd "$work"
          exec "$RUNNER_TEMP/node/bin/node" "$RUNNER_TEMP/node/lib/node_modules/npm/bin/npm-cli.js" "$@" \
              --prefix "$work" --userconfig "$work/no-userconfig" --globalconfig "$work/no-globalconfig" \
              --cache "$RUNNER_TEMP/npm-cache" --registry=https://registry.npmjs.org/ \
              --@altnovatrail:registry=https://registry.npmjs.org/ --ignore-scripts
          EOF
          chmod +x "$RUNNER_TEMP/npm-isolated"

      # A run again of a commit released already publishes the archive its release holds, not one
      # built anew. It downloads that file with its bundle, and checks both before npm sees them:
      # the release's attestation, and the signature of this workflow for this repository at
      # TARGET. The identity is this workflow at any commit or ref of .github, since the button may
      # run with another ref of it pinned than the run that released; which ones count is Т-27's.
      # Only this step has the token, and npm, which reads an archive the caller's code built,
      # never sees it.
      - name: The npm package of the release
        if: inputs.npm-package != '' && inputs.publish && steps.version.outputs.released != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STEM: ${{ steps.npm-name.outputs.stem }}
          RELEASED: ${{ steps.version.outputs.released }}
        run: |
          file="${STEM}-${RELEASED#v}.tgz"
          mkdir "$RUNNER_TEMP/dist"
          gh release download "$RELEASED" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/dist" \
              --pattern "$file" --pattern "${file}.sigstore.json" || true
          if [ ! -f "$RUNNER_TEMP/dist/$file" ] || [ ! -f "$RUNNER_TEMP/dist/${file}.sigstore.json" ]; then
              echo "::error::${RELEASED} holds no ${file} with its bundle ${file}.sigstore.json to publish to npm."
              exit 1
          fi
          gh release verify-asset "$RELEASED" "$RUNNER_TEMP/dist/$file" --repo "$GITHUB_REPOSITORY"
          "$RUNNER_TEMP/cosign" verify-blob --bundle "$RUNNER_TEMP/dist/${file}.sigstore.json" \
              --certificate-identity-regexp '^https://github\.com/altnovatrail/\.github/\.github/workflows/release\.yml@([0-9a-f]{40}|refs/(heads|tags)/.+)$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$TARGET" \
              "$RUNNER_TEMP/dist/$file"

      # The archive npm would publish, checked before the GitHub release exists, which is
      # immutable, so that a package that fails here leaves no release behind:
      # - it lies among the files, under the name npm pack gives it, every entry under package/,
      #   with one package/package.json, whose name is npm-package and version the release's
      #   number without v;
      # - it is not private, and has no publishConfig and no tag of its own, which would change
      #   where and how npm publishes it;
      # - its repository is an object whose url is this repository, as the registry asks of a
      #   package with provenance.
      # The registry is read by its packument, with write=true, as npm reads one before it writes:
      # so the registry's CDN serves no copy cached for minutes. A package it lacks stops a
      # release: its first version is published by hand (architecture 3.3). A version it holds
      # with this archive's integrity is published already; with another, a number npm never takes
      # back would differ from the release's file. A version below the highest one npm holds goes
      # out with the tag previous, since npm puts none below the highest under latest, and latest
      # is never named. Then npm's own dry run, npm-isolated, reads the archive, and has to read
      # the same file and integrity. The check's own files lie apart from the empty folder npm runs
      # in. This step has no token and no OIDC variables, so the dry run, which tries npm's token
      # exchange too, gets nothing to exchange: npm gets a token in the last step alone, which runs
      # only when publish is true.
      - id: npm
        name: Check the npm package
        if: >-
          inputs.npm-package != '' &&
          (steps.version.outputs.version != '' || (inputs.publish && steps.version.outputs.released != ''))
        env:
          NPM_PACKAGE: ${{ inputs.npm-package }}
          STEM: ${{ steps.npm-name.outputs.stem }}
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          files="$RUNNER_TEMP/npm-files"
          mkdir -p "$files"
          version="${VERSION#v}"
          file="$RUNNER_TEMP/dist/${STEM}-${version}.tgz"
          if [ -L "$file" ] || [ ! -f "$file" ]; then
              echo "::error::The release's files hold no ${file##*/}, the archive npm pack makes of ${NPM_PACKAGE} ${version}."
              exit 1
          fi
          entries=$(tar -tzf "$file")
          if grep -qv '^package/' <<< "$entries" || [ "$(grep -cx 'package/package.json' <<< "$entries")" != 1 ]; then
              echo "::error::${file##*/} is no archive npm pack makes: every entry lies under package/, with one package/package.json."
              exit 1
          fi
          manifest="$files/package.json"
          tar -xzOf "$file" package/package.json > "$manifest"
          if ! jq -e 'type == "object"' "$manifest" > /dev/null; then
              echo "::error::The package.json of ${file##*/} is no JSON object."
              exit 1
          fi
          if [ "$(jq -r '.name' "$manifest")" != "$NPM_PACKAGE" ] || [ "$(jq -r '.version' "$manifest")" != "$version" ]; then
              echo "::error::${file##*/} holds $(jq -r '"\(.name)@\(.version)"' "$manifest"), not ${NPM_PACKAGE}@${version}: the release's number, without v, is the package's version."
              exit 1
          fi
          if jq -e '.private == true or has("publishConfig") or has("tag")' "$manifest" > /dev/null; then
              echo "::error::The package.json of ${file##*/} is private, or has a publishConfig or a tag of its own, which would change how npm publishes it."
              exit 1
          fi
          url=$(jq -r 'if (.repository | type) == "object" then .repository.url // "" else "" end' "$manifest")
          url="${url#git+}"
          url="${url%.git}"
          if [ "$url" != "https://github.com/${GITHUB_REPOSITORY}" ]; then
              echo "::error::The package.json of ${file##*/} names its repository as \"${url}\", not as an object whose url is git+https://github.com/${GITHUB_REPOSITORY}.git: the registry refuses provenance from another repository."
              exit 1
          fi
          integrity="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
          packument="$files/packument.json"
          code=$(curl -sS --proto "=https" --retry 3 -o "$packument" -w '%{http_code}' \
              "https://registry.npmjs.org/${NPM_PACKAGE/\//%2f}?write=true")
          tag=""
          case "$code" in
              404)
                  if [ "$PUBLISH" = true ]; then
                      echo "::error::${NPM_PACKAGE} is not in the npm registry. Its first version is published by hand and a trusted publisher set on it; only then does a release publish (architecture 3.3)."
                      exit 1
                  fi
                  echo "::notice::${NPM_PACKAGE} is not in the npm registry yet, which matters not with publish false."
                  action=publish
                  ;;
              200)
                  published=$(jq -r --arg v "$version" '(.versions // {})[$v].dist.integrity // ""' "$packument")
                  if [ -n "$published" ] && [ "$published" != "$integrity" ]; then
                      echo "::error::${NPM_PACKAGE}@${version} is in the npm registry with the integrity ${published}, and this archive's is ${integrity}. npm never takes a version back: the next release, with a new number, publishes the package."
                      exit 1
                  elif [ -n "$published" ]; then
                      echo "::notice::${NPM_PACKAGE}@${version} is in the npm registry already, with this archive's integrity."
                      action=skip
                  else
                      highest=$(jq -r '(.versions // {}) | to_entries[] | select(.value.deprecated == null) | .key | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$packument" | sort -V | tail -n 1)
                      if [ -n "$highest" ] && [ "$(printf '%s\n' "$version" "$highest" | sort -V | tail -n 1)" = "$highest" ]; then
                          tag=previous
                      fi
                      action=publish
                  fi
                  ;;
              *)
                  echo "::error::The npm registry answered ${code} for ${NPM_PACKAGE}."
                  exit 1
                  ;;
          esac
          if [ "$action" = publish ]; then
              tag_args=()
              if [ -n "$tag" ]; then tag_args=(--tag "$tag"); fi
              "$RUNNER_TEMP/npm-isolated" publish "$file" --dry-run --json --access public "${tag_args[@]}" \
                  --loglevel verbose > "$files/dry-run.json"
              if ! jq -e --arg n "$NPM_PACKAGE" --arg f "${file##*/}" --arg i "$integrity" \
                  '.[$n].filename == $f and .[$n].integrity == $i' "$files/dry-run.json" > /dev/null; then
                  echo "::error::npm's dry run did not read ${file##*/} with the integrity ${integrity}."
                  exit 1
              fi
          fi
          echo "${NPM_PACKAGE}@${version}: ${integrity}, ${action}${tag:+, tag ${tag}}"
          {
              echo "action=${action}"
              echo "tag=${tag}"
              echo "integrity=${integrity}"
              echo "file=${file}"
          } >> "$GITHUB_OUTPUT"

      # Every file gets a bundle beside it, its signature and the certificate that says which
      # workflow made it, and every bundle is checked before anything is published: the identity
      # is this workflow at the ref the caller pins, job.workflow_ref, issued to GitHub Actions, in
      # the caller's repository, at TARGET. The certificate of the first file is printed, its
      # extensions among it, for whoever checks the signatures later (T37 in spec); a print that
      # fails says so and holds nothing up.
      - name: Sign every file
        if: steps.version.outputs.version != ''
        env:
          IDENTITY: https://github.com/${{ job.workflow_ref }}
        run: |
          cosign="$RUNNER_TEMP/cosign"
          cd "$RUNNER_TEMP/dist"
          files=(*)
          for file in "${files[@]}"; do
              "$cosign" sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
          for file in "${files[@]}"; do
              "$cosign" verify-blob --bundle "${file}.sigstore.json" \
                  --certificate-identity "$IDENTITY" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
                  --certificate-github-workflow-sha "$TARGET" \
                  "$file"
          done
          if ! jq -r '.verificationMaterial.certificate.rawBytes' "${files[0]}.sigstore.json" \
              | base64 -d | openssl x509 -inform DER -noout -text; then
              echo "::warning::The certificate of ${files[0]} could not be printed; its bundle verified."
          fi
          ls -l

      # Every release is marked Latest: its number is the highest so far, and the tip of main may
      # get no release of its own when it changes nothing the release is built from. The notes run
      # from the release before this one. A refusal of the Releases API is let pass only as
      # spec's release-refusal decides, as in .github's own release (R14). The recipe runs in a
      # new copy of the checkout, taken after main is fetched again: the version step's copy has
      # no new tip, and a fetch there would read a .git/config a container may have changed. No
      # container has had the checkout, so the new copy's script is the one the tag holds.
      - id: publish
        name: Publish the release
        if: steps.version.outputs.version != '' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          if ! gh release create "$VERSION" "$RUNNER_TEMP"/dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$VERSION" \
              --latest \
              --generate-notes "${start[@]}" 2> "$RUNNER_TEMP/release-create.err"; then
              cat "$RUNNER_TEMP/release-create.err" >&2
              git fetch --quiet --no-tags --no-recurse-submodules origin refs/heads/main
              tip=$(git rev-parse FETCH_HEAD)
              cp -a . "$RUNNER_TEMP/checkout-tip"
              if ! (cd "$RUNNER_TEMP/checkout-tip" &&
                  spec/tools/toolchain/toolchain.sh spec release-refusal \
                      "$TARGET" "$tip" "$RUNNER_TEMP/release-create.err"); then
                  exit 1
              fi
              echo "::warning::${TARGET} is no longer the tip of main (${tip}) and adds or modifies its workflow files, and the Releases API refused it; the release of the tip covers it."
              exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The release is immutable and attested, and so is every file in it; the attestation may
      # take a moment to appear. A run again of a commit released already verifies its release.
      - name: Verify the release
        if: steps.publish.outputs.published == 'true' || (steps.version.outputs.released != '' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
        run: |
          for attempt in 1 2 3 4 5; do
              if gh release verify "$VERSION" --repo "$GITHUB_REPOSITORY"; then
                  break
              fi
              if [ "$attempt" = 5 ]; then
                  echo "::error::${VERSION} is published, but its attestation does not verify."
                  exit 1
              fi
              echo "attempt $attempt: not verified yet"
              sleep 10
          done
          if [ -d "$RUNNER_TEMP/dist" ]; then
              for file in "$RUNNER_TEMP"/dist/*; do
                  gh release verify-asset "$VERSION" "$file" --repo "$GITHUB_REPOSITORY"
              done
          fi

      # The package goes to npm once its release is out and verified, the same archive, by trusted
      # publishing: npm exchanges the job's OIDC token for one that may publish this package, if a
      # trusted publisher of the package names the caller's repository and release workflow, and
      # makes its provenance itself. npm-isolated runs it as in the check above, but with the OIDC
      # variables. Its exit status is not the verdict, the registry is: npm may end well with a
      # version only staged, or fail on a version that went out (npm/cli#9889). So the step asks
      # the packument, with write=true, until the version is there — for five minutes at most, or
      # half a minute after npm failed — and then the archive the registry serves has to be this
      # file, byte for byte. A version npm holds already is not published
      # again, and a refusal release-refusal lets pass leaves the step out, as publish false does.
      # If npm fails after the release is out, running the job again publishes the release's file.
      - name: Publish to npm
        if: >-
          inputs.npm-package != '' &&
          (steps.publish.outputs.published == 'true' || (inputs.publish && steps.version.outputs.released != ''))
        env:
          NPM_PACKAGE: ${{ inputs.npm-package }}
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
          ACTION: ${{ steps.npm.outputs.action }}
          TAG: ${{ steps.npm.outputs.tag }}
          INTEGRITY: ${{ steps.npm.outputs.integrity }}
          FILE: ${{ steps.npm.outputs.file }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          files="$RUNNER_TEMP/npm-files"
          mkdir -p "$files"
          version="${VERSION#v}"
          if [ "$ACTION" != publish ]; then
              echo "::notice::${NPM_PACKAGE}@${version} is in the npm registry already: nothing to publish."
              exit 0
          fi
          tag_args=()
          if [ -n "$TAG" ]; then tag_args=(--tag "$TAG"); fi
          status=0
          "$RUNNER_TEMP/npm-isolated" publish "$FILE" --access public "${tag_args[@]}" --loglevel verbose || status=$?
          # A publish npm reports as done may take a while to show; one npm reports as failed is
          # looked for briefly, in case it went out all the same.
          attempts=30
          if [ "$status" != 0 ]; then attempts=3; fi
          packument="$files/packument.json"
          published=""
          for attempt in $(seq 1 "$attempts"); do
              code=$(curl -sS --proto "=https" --retry 3 -o "$packument" -w '%{http_code}' \
                  "https://registry.npmjs.org/${NPM_PACKAGE/\//%2f}?write=true") || code=""
              if [ "$code" = 200 ]; then
                  published=$(jq -r --arg v "$version" '(.versions // {})[$v].dist.integrity // ""' "$packument")
                  if [ -n "$published" ]; then break; fi
              fi
              echo "attempt ${attempt}: ${NPM_PACKAGE}@${version} is not in the registry yet"
              sleep 10
          done
          workflow="${CALLER_WORKFLOW_REF%@*}"
          if [ -z "$published" ] && [ "$status" = 0 ]; then
              echo "::error::npm publish ended well, but ${NPM_PACKAGE}@${version} is not in the registry after five minutes: it may be only staged, by a trusted publisher that allows npm stage publish alone, or npm/cli#9889. Approve or reject it on npmjs.com, let the trusted publisher publish, and run the job again."
              exit 1
          elif [ -z "$published" ]; then
              echo "::error::npm publish failed with ${status}, and ${NPM_PACKAGE}@${version} is not in the registry; the lines above say why. The package's trusted publisher names the repository ${GITHUB_REPOSITORY}, the workflow ${workflow##*/}, no environment, and allows npm publish."
              exit 1
          elif [ "$published" != "$INTEGRITY" ]; then
              echo "::error::${NPM_PACKAGE}@${version} is in the registry with the integrity ${published}, and the release's file has ${INTEGRITY}."
              exit 1
          fi
          tarball=$(jq -r --arg v "$version" '.versions[$v].dist.tarball' "$packument")
          case "$tarball" in
              https://registry.npmjs.org/*) ;;
              *)
                  echo "::error::The registry serves ${NPM_PACKAGE}@${version} from \"${tarball}\", not from https://registry.npmjs.org/."
                  exit 1
                  ;;
          esac
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 -o "$files/registry.tgz" "$tarball"
          if ! cmp "$FILE" "$files/registry.tgz"; then
              echo "::error::The archive the registry serves for ${NPM_PACKAGE}@${version} is not the release's file."
              exit 1
          fi
          if [ "$status" != 0 ]; then
              echo "::warning::npm publish failed with ${status}, but the registry holds ${NPM_PACKAGE}@${version}, the release's file byte for byte."
          fi
          if ! jq -e --arg v "$version" '.versions[$v].dist.attestations.provenance' "$packument" > /dev/null; then
              echo "::warning::${NPM_PACKAGE}@${version} has no provenance in the registry."
          fi
          echo "${NPM_PACKAGE}@${version} is published${TAG:+ with the tag ${TAG}}: ${published}"
