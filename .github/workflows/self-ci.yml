# The CI of .github itself (R03). It calls the shared workflows by local path, so that a pull
# request checks the very version it changes (R04). The rulesets of main require the checks by
# their names, "<job name> / <the shared workflow's job>", and the release of .github follows this
# workflow by its name, CI: renaming a job or the workflow breaks them (R04, R33, R49).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: ./.github/workflows/secrets.yml

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dco.yml

  documents:
    name: Documents
    uses: ./.github/workflows/documents.yml

  # id-token: write is for go.yml's coverage job alone: a called workflow can only lower what this
  # job gives it (R16, R33).
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/go.yml

  # actionlint and shellcheck at exact versions, by the archive's SHA-256 (R08): shellcheck
  # publishes no checksums, so its is the SHA-256 of the archive as downloaded. actionlint takes
  # that shellcheck by path, not the runner image's, and no pyflakes: there is no Python here. A
  # waiver goes in .github/actionlint.yaml, with its reason.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$archive" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xzf "$archive" actionlint

      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$archive" \
              "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" --strip-components=1 -xJf "$archive" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck="$RUNNER_TEMP/shellcheck" -pyflakes='

      # The SHA-256 is the column of checksums that checksums_hashes_order of yq's release names
      # SHA-256. tests/run.sh holds the yq it is given to YQ_VERSION here (R28).
      - name: Install yq
        env:
          YQ_VERSION: "4.54.1"
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          yq="$RUNNER_TEMP/yq"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$yq" \
              "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  ${yq}" | sha256sum --check --strict
          chmod +x "$yq"

      # actionlint reads only the scripts inside the workflows; shellcheck follows what the tests and
      # their stand-ins source.
      - name: Lint the tests
        run: '"$RUNNER_TEMP/shellcheck" --external-sources tests/*.sh tests/stubs/*'

      # actionlint reads no composite action: shellcheck reads each run script as bash, the shell
      # their steps name (R49).
      - name: Lint the actions
        run: |
          status=0
          for action in .github/actions/*/action.yml; do
              count=$("$RUNNER_TEMP/yq" '[.runs.steps[] | select(has("run"))] | length' "$action")
              for ((i = 0; i < count; i++)); do
                  step=$("$RUNNER_TEMP/yq" "[.runs.steps[] | select(has(\"run\"))] | .[$i].name" "$action")
                  "$RUNNER_TEMP/yq" "[.runs.steps[] | select(has(\"run\"))] | .[$i].run" "$action" > "$RUNNER_TEMP/action-step.sh"
                  if ! "$RUNNER_TEMP/shellcheck" --shell=bash "$RUNNER_TEMP/action-step.sh"; then
                      echo "::error file=${action}::The script of the step ${step} fails shellcheck."
                      status=1
                  fi
              done
          done
          exit "$status"

      # A change to a step comes with its cases (R28). A test stops after two minutes, and the suite
      # after five, inside the job's ten.
      - name: Test the workflows
        timeout-minutes: 5
        run: YQ="$RUNNER_TEMP/yq" bash tests/run.sh

      # The toolchain stage, for spec's recipe licenses-allowed below (R31 spec), by the script of
      # .github's own submodule, which the step does not look for. Its image shares the entry of the
      # cache with documents.yml's by the same three steps, and only a push to main saves it (R36,
      # R42).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
          SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$SAVE" != true ] && [ ! -f "$TOOLCHAIN_IMAGE_FILE" ]; then
              unset TOOLCHAIN_IMAGE_FILE
          fi
          spec/tools/toolchain/toolchain.sh build

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # go.yml carries a copy of the list spec's licenses-allowed prints at the tag .github is on, so
      # a move to a tag that changes the list turns this red until go.yml follows (R16, R39 spec).
      # typescript.yml carries none: its callers check by spec's recipe (R19). The list is taken by
      # assignment, not through a pipe: the shell has no pipefail, and a recipe that failed would
      # pass as an empty list. go.yml is named on its own, since it must carry the list, and each
      # copy is checked apart, so a red step says which one strayed.
      - name: The license lists of the workflows
        run: |
          allowed=$(spec/tools/toolchain/toolchain.sh spec licenses-allowed)
          if [ -z "$allowed" ] || printf '%s\n' "$allowed" | grep -qvE '^[A-Za-z0-9.+-]+$'; then
              echo "::error::spec's licenses-allowed printed no list, or a line that is no SPDX identifier."
              exit 1
          fi
          spec_list=$(printf '%s\n' "$allowed" | sort)
          strayed=0
          while read -r workflow; do
              list=$(sed -n 's/^ *ALLOWED_LICENSES: //p' ".github/workflows/$workflow" | tr ',' '\n' | sort)
              if [ "$spec_list" != "$list" ]; then
                  echo "::error::ALLOWED_LICENSES in $workflow is not the list spec's licenses-allowed prints."
                  diff <(echo "$spec_list") <(echo "$list") || true
                  strayed=1
              else
                  echo "$workflow allows the $(echo "$spec_list" | wc -l) licenses spec allows."
              fi
          done < <({ printf '%s\n' go.yml; grep -l '^ *ALLOWED_LICENSES:' .github/workflows/*.yml | xargs -r -n1 basename; } | sort -u)
          exit "$strayed"

  # The composite action, run by local path as a caller's own job runs it, so that a pull request
  # runs the very action it changes and a push to main its save: .github calls go.yml without
  # same-bits, so its job arm64 never runs the action here (R49).
  toolchain-action:
    name: Toolchain action
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain image and Go caches
        uses: ./.github/actions/toolchain
        with:
          check: action

      - name: The tool of the rules of code
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain go -C tools/coderules build ./...

      - name: Go caches into the cache
        uses: ./.github/actions/toolchain
        with:
          check: action
          save: "true"
