# The CI of .github itself (R03). Its own workflows start with self-; the ones without the prefix
# are the shared workflows, which other repositories call by SHA (R04) and this one calls by local
# path, so that a pull request checks the very version it changes.
#
# The check names are what each repository's ruleset of main requires: "<job name> / <name of the
# shared workflow's job>" — Secrets / gitleaks, DCO / sign-off, Documents / docs-check-repo — and
# Workflows, which only .github runs: the code of the shared workflows lives here.
# Renaming a job breaks those rules, and the release of .github follows this workflow by its
# name, CI (R04).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: ./.github/workflows/secrets.yml

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dco.yml

  documents:
    name: Documents
    uses: ./.github/workflows/documents.yml

  # actionlint over every workflow of the repository, with shellcheck over the scripts inside them.
  # Both come at exact versions, by the archive's SHA-256, as gitleaks does (R08): actionlint's from
  # actionlint_1.7.12_checksums.txt; shellcheck publishes no checksums, so its is the SHA-256 of the
  # archive as downloaded on 2026-10-20. actionlint is given that shellcheck by path, not whatever
  # the runner image has, and no pyflakes: there is no Python here. A waiver, when one is needed,
  # goes in .github/actionlint.yaml, with its reason. The job also holds the license lists of
  # go.yml and typescript.yml to spec's, which is why spec comes along as the submodule.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$archive" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xzf "$archive" actionlint

      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$archive" \
              "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" --strip-components=1 -xJf "$archive" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck="$RUNNER_TEMP/shellcheck" -pyflakes='

      # go.yml and typescript.yml hand the license check of every Go and TypeScript repository a
      # copy of spec's list (R16, R19): the ASF's Category A in spec/tools/licenses/config.mjs, at
      # the tag .github is on. A move to a tag that changes the list turns this red until both
      # follow. spec has no interface for the list yet (В19 in RUN.md), so the file is read as
      # text: every line between "export const allowed = [" and "];" has to be one quoted
      # identifier, and any other line — a comment, a second identifier, another quote or indent —
      # stops the step rather than being skipped. Each copy is named on its own, so a red step
      # says which one strayed: the two wrappers, which must have one, and any other workflow
      # that comes to carry ALLOWED_LICENSES.
      - name: The license lists of go.yml and typescript.yml
        run: |
          body=$(sed -n '/^export const allowed = \[$/,/^\];$/p' spec/tools/licenses/config.mjs | sed '1d;$d')
          if [ -z "$body" ] || printf '%s\n' "$body" | grep -qvE '^  "[A-Za-z0-9.+-]+",?$'; then
              echo "::error::spec/tools/licenses/config.mjs no longer lists one quoted identifier a line between \"export const allowed = [\" and \"];\": read it again."
              exit 1
          fi
          spec_list=$(printf '%s\n' "$body" | sed 's/^  "\(.*\)",\{0,1\}$/\1/' | sort)
          strayed=0
          while read -r workflow; do
              list=$(sed -n 's/^ *ALLOWED_LICENSES: //p' ".github/workflows/$workflow" | tr ',' '\n' | sort)
              if [ "$spec_list" != "$list" ]; then
                  echo "::error::ALLOWED_LICENSES in $workflow is not the list of spec/tools/licenses/config.mjs."
                  diff <(echo "$spec_list") <(echo "$list") || true
                  strayed=1
              else
                  echo "$workflow allows the $(echo "$spec_list" | wc -l) licenses spec allows."
              fi
          done < <({ printf '%s\n' go.yml typescript.yml; grep -l '^ *ALLOWED_LICENSES:' .github/workflows/*.yml | xargs -r -n1 basename; } | sort -u)
          exit "$strayed"
