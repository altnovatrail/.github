# Shared check (R03, R16): the Go code of the repository that calls it, by four recipes of that
# repository's own — ci-lint, ci-test, ci-vuln and ci-licenses — one job each, in the toolchain
# stage of the caller's .devcontainer/Dockerfile, where the caller pins its Go; the recipes pin
# the versions of the tools they run. What the checks do is the repository's; how they are run is
# the same everywhere (R30 in spec). Each job is a check of the caller's ruleset of main:
# "Go / lint", "Go / test", "Go / vuln" and "Go / licenses", when the calling job is named Go.
#
# ci-test writes the coverage of the tests as one Go coverage profile, coverage/go.out, and the
# job coverage sends it to Codecov by OIDC, with no secret (R48 in spec). "Go / coverage" is no
# check of the ruleset: codecov/patch, which Codecov sets from the upload, is.
#
# ci-licenses is handed the licenses a NovaTrail repository may build from: the ASF's Category A
# as SPDX identifiers, the list spec checks its own tools against (R12 in spec). It lives here,
# where a change to it is a change to this workflow and so a release (architecture 2.7), and
# self-ci.yml holds it to spec's own list at the tag .github is on. A repository's exceptions are
# its recipe's, each with its decision.
#
# Each job that runs in the toolchain stage takes its image from the caller's cache of GitHub
# Actions, so that an outage of what the Dockerfile downloads from does not fail the checks while
# the Dockerfile stays the same (R36). On a miss the job toolchain alone builds it and hands it on
# to the others by an artifact of the run, and a push to main alone saves it (R42).
# The caches of Go — the modules, the builds and golangci-lint's — come from the same cache, one
# entry for each check, which a push to main alone saves (R41).
#
# With same-bits, four more jobs hold the caller's bits the same on every build (R107 in spec), as
# learner-model and engine held them each in a recipe of its own (R09 learner-model; R10 engine).
# "Go / targets" holds the tests on the builds where the bits are most at risk, wasip1 among them,
# which run at once, a job "Go / target <target>" each (R43); "Go / fma-diff" compares the
# assembler of each package with fusion and without it, on its targets at once, with a control of
# its own here; "Go / arm64" runs ci-test and the targets of its host on an arm64
# runner; "Go / rules" holds the code to the rules of code by the tool tools/coderules of .github,
# of this workflow's own version, and the caller's lists, .github/coderules.json (R33). Without the
# input the workflow is what it was.
#
# .github's own Go code is the tool of the rules of code alone, which self-ci.yml checks by this
# workflow without same-bits: a change here is tried from a Go repository's pull request that calls
# this file by the SHA of the branch, or by a trial pull request of .github that calls it by local
# path and is never merged, before the release (R16).
# Called from a job that gives it `contents: read` and `id-token: write`: the coverage job alone
# asks for the token, and a called workflow can only lower what its caller gives.

name: Go (shared)

on:
  workflow_call:
    inputs:
      same-bits:
        description: Hold the bits the same on every build, by "Go / targets", "Go / fma-diff", "Go / arm64" and "Go / rules" (R107 in spec).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The image of the toolchain stage of the caller's .devcontainer/Dockerfile, built at most once
  # for the jobs of this file that run on amd64 (R36, R42). It comes from the caller's cache of
  # GitHub Actions, as spec decided for the stage in CI and canvas does (the amendment of 2026-11-09
  # to R31 in spec; R57 canvas): a file of docker save, by the key of the runner's OS and
  # architecture and the hash of the Dockerfile. The Dockerfile pins everything it installs, by
  # version and sum (R34, R40 in spec), so the image from the cache is the one it would build, and
  # on a hit it does not run: nodejs.org, GitHub and the snapshot of Ubuntu's archive are not asked.
  # On a hit this job only looks the entry up, and each job after it restores the file. On a miss
  # it builds the image alone and hands the file to the jobs after it as an artifact of the run,
  # kept a day and compressed fast. Only a push to main saves the file into the cache: an entry of a
  # pull request is "restored by re-runs of the pull request" alone, and the one of main, which
  # every pull request reads, its CI on a push to main saves. The path and the image's name are
  # those of spec's toolchain.sh, by which documents.yml and spec's CI build the stage, so that a
  # caller keeps one entry for all of them ("Cache Version" in the README of actions/cache); a
  # change to how the image is built takes a new path in all of them at once. The file lies
  # outside the checkout, where the recipes do not see it, and the Dockerfile copies nothing from
  # the repository, so it is built without a context. A build or an upload that fails here fails
  # no check: the jobs after this one build the image themselves, and fail with the build when the
  # Dockerfile is broken.
  toolchain:
    name: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      # The artifact the jobs after this one download, or nothing when there is none.
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # The Dockerfile alone, which the key hashes and the build reads: a sparse checkout fetches
      # no other file of the caller's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .devcontainer/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
          lookup-only: true

      - name: Toolchain image
        id: image
        if: steps.toolchain.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          SAVE: "true"
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.image.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Toolchain image for the jobs after this one
        id: upload
        if: steps.image.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-toolchain-image
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          retention-days: 1
          compression-level: 1
          overwrite: true
          if-no-files-found: ignore

  check:
    # Named after the check, so that each reads "<calling job> / <check>": "Go / lint" for ci-lint.
    name: ${{ matrix.check }}
    needs: toolchain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every check reports on its own, rather than the first one to fail cancelling the rest.
      fail-fast: false
      matrix:
        check: [lint, test, vuln, licenses]
    steps:
      # Without the spec submodule: code takes spec's files from spec's releases, not from the
      # submodule (R21 in spec), so a check that reads spec/ fails here as it would for a user.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image of the toolchain stage, from the caller's cache of GitHub Actions, or on a miss
      # from the job toolchain, which built it once for the jobs of this run (R36, R42). With
      # neither, or with a file that does not load as the image novatrail-toolchain, the step builds
      # the image itself, so that what failed there costs the run its speed, not its verdict. It
      # writes no file: the job toolchain saves the image.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image from the job toolchain
        if: steps.toolchain.outputs.cache-hit != 'true' && needs.toolchain.outputs.artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.toolchain.outputs.artifact }}
          path: ${{ runner.temp }}

      - name: Toolchain image
        env:
          SAVE: "false"
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      # The caches of Go come from the caller's cache of GitHub Actions too, as one folder outside
      # the checkout: the modules, GOMODCACHE, the builds, GOCACHE, and golangci-lint's,
      # GOLANGCI_LINT_CACHE (R41). Each docker run of the job mounts it at /go-cache and points the
      # three variables into it. The key is the runner's OS and architecture, the check, the
      # Dockerfile, which pins the Go, and the go.sum files, which pin the modules, and there is no
      # restore key: an entry restored by a prefix would carry every module and build of the
      # entries before it into the next, which nothing prunes. Only a push to main saves an entry
      # (below), so a pull request reads main's.
      - name: Go caches from the cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.check }}-${{ hashFiles('.devcontainer/Dockerfile') }}-${{ hashFiles('**/go.sum') }}

      # The three folders, empty on a miss. What the cache gave is checked first by go mod verify,
      # in every module of the caller — each go.mod git tracks outside testdata/, vendor/ and the
      # folders whose names start with . or _, which ./... leaves out too —: each module of their
      # builds is hashed again against the hash it was downloaded with, which go checks against
      # go.sum whenever it takes the module. A tool run by go run <module>@<version> go checks the
      # same way against the checksum database, but its folder no verify hashes: it is held, like
      # GOCACHE, by main's scope. A check that fails or cannot run costs the run its caches and not
      # its verdict: they are deleted with a warning, and the recipes download and build as with
      # none. Verified caches have their builds touched: go deletes a build it has not used for five
      # days, by its time, at the end of a command, and an entry keeps the times of its save, so
      # the first command of a job would delete what the next ones need (R41).
      - name: Go caches
        env:
          RESTORED: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: |
          cache=$RUNNER_TEMP/go-cache
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"
          if [ -z "$RESTORED" ]; then
              echo "Go caches: none in the cache; the job starts with empty ones."
              exit 0
          fi
          verified=false
          if git ls-files -z -- ':(glob)**/go.mod' ':(exclude,glob)**/testdata/**' ':(exclude,glob)**/vendor/**' \
              ':(exclude,glob)**/.*/**' ':(exclude,glob)**/_*/**' > "$RUNNER_TEMP/go-modules"; then
              modules=()
              while IFS= read -r -d '' file; do
                  modules+=("$(dirname -- "$file")")
              done < "$RUNNER_TEMP/go-modules"
              if [ "${#modules[@]}" = 0 ]; then
                  echo "Go caches: ${RESTORED}, with no module of the repository to verify them by."
                  verified=true
              elif docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
                  --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
                  --volume "$PWD:/work" --volume "$cache:/go-cache" --workdir /work \
                  novatrail-toolchain bash -c 'for module in "$@"; do go -C "$module" mod verify || exit; done' bash "${modules[@]}"; then
                  echo "Go caches: ${RESTORED}, its modules verified."
                  verified=true
              fi
          fi
          if [ "$verified" = true ]; then
              find "$cache/build" "$cache/lint" -type f -exec touch -c -- {} +
              exit 0
          fi
          echo "::warning::The Go caches of ${RESTORED} did not pass go mod verify: they are deleted, and the job downloads and builds without them. An entry that fails on every run stays until it is deleted (gh cache delete) or go.sum or the Dockerfile changes."
          chmod -R u+w -- "$cache"
          rm -rf -- "$cache"
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"

      # As in documents.yml, the container runs as the runner's user: what it writes in the
      # checkout is the runner's, and git finds the repository owned by the user it runs as. Its
      # home is /tmp, and its Go caches are the folder above. Of the step's environment only
      # ALLOWED_LICENSES goes in.
      - name: ci-${{ matrix.check }}
        env:
          RECIPE: ci-${{ matrix.check }}
          ALLOWED_LICENSES: 0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC0-1.0,ISC,MIT,MIT-0,Unlicense
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env ALLOWED_LICENSES \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain just "$RECIPE"

      # The test job hands the report its recipe wrote to the coverage job, the one job that may ask
      # for an OIDC token: this one runs the code under test. A recipe that wrote none fails
      # "Go / test", as it owes one (R16). The report is kept a week, so that the coverage job can
      # be run again after an outage of Codecov. The name is the wrapper's own: an artifact's name
      # is unique in a run, and the caller's own jobs may upload one called coverage, as spec's do.
      - name: Coverage report
        if: matrix.check == 'test'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage/go.out
          retention-days: 7
          if-no-files-found: error

      # A push to main saves the caches, once its recipes have passed, under a key no entry holds
      # yet: an entry is never replaced, and an entry a pull request saved would be read by its own
      # re-runs alone, so a pull request and every other event only read (R41). A save that fails
      # costs the next run its speed, not this one its verdict. release.yml takes no cache.
      - name: Go caches into the cache
        if: steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Codecov takes the report by OIDC, with no secret (R48 in spec). This job alone may ask GitHub for
  # the token, which only Codecov accepts and which grants nothing in the repository, and it runs
  # none of the repository's code. A pull request from a fork gets no token: the action then sends
  # the report without one, as Codecov takes it from a fork's branch. The job waits for the four
  # checks of check, as spec's upload does — not for the jobs of same-bits, which hand it no report.
  # A red one holds the merge anyway.
  #
  # Any failure of the job fails a pull request, so that a missing codecov/patch has its reason in
  # sight. Elsewhere, on main, it does not fail the run: the caller's release waits for CI to pass,
  # and an outage of Codecov must not hold it back.
  coverage:
    name: coverage
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # The files of the commit, which the upload lists so that Codecov can match the report's paths
      # to them; without the spec submodule, as the checks. Which commit and pull request the report
      # is for, the action takes from the event.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-coverage
          path: coverage

      # The Codecov CLI at an exact version, checked against its SHA-256 here, as the tools of
      # self-ci.yml are (R08), rather than against a key the action would fetch during the run. The
      # sum is the one the release's codecov.SHA256SUM gives, whose signature checks against the key
      # Codecov's docs name by its fingerprint. Dependabot moves the actions' SHAs alone: the
      # version and its sum are raised by hand, together, and in typescript.yml too.
      - name: Codecov CLI
        env:
          CLI_VERSION: v11.3.2
          CLI_SHA256: 8e1bfb71661378530f6ea21e82b414095899e565cbb4cf555c613064be17b973
        run: |
          cli="$RUNNER_TEMP/codecov"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$cli" "https://cli.codecov.io/${CLI_VERSION}/linux/codecov"
          echo "${CLI_SHA256}  ${cli}" | sha256sum --check --strict
          chmod +x "$cli"

      # The one report alone: no search for others, and no plugins, which would run coverage tools
      # of their own. A failed upload fails the job, as any of its steps does.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: coverage/go.out
          disable_search: true
          plugins: noop
          disable_telem: true
          fail_ci_if_error: true

  # The caller's tests again, without the race detector and coverage, which Go does not have on 386
  # and wasm: on amd64 with GOAMD64 v3, where the compiler fuses an addition; with v1 and
  # GODEBUG=cpu.all=off, with no processor extension for the runtime and the standard library to
  # pick their path by; on 386; in js/wasm, in the Node of the toolchain stage; and in wasip1, in
  # node:wasi of the same Node, by an executor the script writes, since Go's go_wasip1_wasm_exec
  # knows only runtimes the stage does not have (sources 10.1); wasip1 is vetted too. A host other
  # than amd64 runs no amd64 build and none for 386, and runs its own build with cpu.all=off. The
  # list is learner-model's and engine's recipe test-targets (R107 in spec), with wasip1 run by the
  # amendment of 2026-11-11 to it (R39), and the script goes to the container on stdin, so that one
  # container keeps the build cache from run to run. Each target is a job of the matrix, so that
  # they run at once, and the job targets after them is the one check of the caller's ruleset
  # (R43). The script is one for the matrix and arm64: it runs the targets TARGETS names, in order.
  target:
    # "Go / target amd64-v3" and the like: none is a check of the ruleset, "Go / targets" is.
    name: target ${{ matrix.target }}
    needs: toolchain
    if: ${{ !cancelled() && inputs.same-bits }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every target reports on its own, rather than the first one to fail cancelling the rest.
      fail-fast: false
      matrix:
        target: [amd64-v3, cpu-off, "386", js-wasm, wasip1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain stage from the cache or the job toolchain, as in the job check (R36, R42).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image from the job toolchain
        if: steps.toolchain.outputs.cache-hit != 'true' && needs.toolchain.outputs.artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.toolchain.outputs.artifact }}
          path: ${{ runner.temp }}

      - name: Toolchain image
        env:
          SAVE: "false"
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      # The Go caches from the cache, as in the job check (R41), an entry for each target (R43).
      - name: Go caches from the cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-target-${{ matrix.target }}-${{ hashFiles('.devcontainer/Dockerfile') }}-${{ hashFiles('**/go.sum') }}

      # The three folders, empty on a miss. What the cache gave is checked first by go mod verify,
      # in every module of the caller — each go.mod git tracks outside testdata/, vendor/ and the
      # folders whose names start with . or _, which ./... leaves out too —: each module of their
      # builds is hashed again against the hash it was downloaded with, which go checks against
      # go.sum whenever it takes the module. A tool run by go run <module>@<version> go checks the
      # same way against the checksum database, but its folder no verify hashes: it is held, like
      # GOCACHE, by main's scope. A check that fails or cannot run costs the run its caches and not
      # its verdict: they are deleted with a warning, and the recipes download and build as with
      # none. Verified caches have their builds touched: go deletes a build it has not used for five
      # days, by its time, at the end of a command, and an entry keeps the times of its save, so
      # the first command of a job would delete what the next ones need (R41).
      - name: Go caches
        env:
          RESTORED: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: |
          cache=$RUNNER_TEMP/go-cache
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"
          if [ -z "$RESTORED" ]; then
              echo "Go caches: none in the cache; the job starts with empty ones."
              exit 0
          fi
          verified=false
          if git ls-files -z -- ':(glob)**/go.mod' ':(exclude,glob)**/testdata/**' ':(exclude,glob)**/vendor/**' \
              ':(exclude,glob)**/.*/**' ':(exclude,glob)**/_*/**' > "$RUNNER_TEMP/go-modules"; then
              modules=()
              while IFS= read -r -d '' file; do
                  modules+=("$(dirname -- "$file")")
              done < "$RUNNER_TEMP/go-modules"
              if [ "${#modules[@]}" = 0 ]; then
                  echo "Go caches: ${RESTORED}, with no module of the repository to verify them by."
                  verified=true
              elif docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
                  --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
                  --volume "$PWD:/work" --volume "$cache:/go-cache" --workdir /work \
                  novatrail-toolchain bash -c 'for module in "$@"; do go -C "$module" mod verify || exit; done' bash "${modules[@]}"; then
                  echo "Go caches: ${RESTORED}, its modules verified."
                  verified=true
              fi
          fi
          if [ "$verified" = true ]; then
              find "$cache/build" "$cache/lint" -type f -exec touch -c -- {} +
              exit 0
          fi
          echo "::warning::The Go caches of ${RESTORED} did not pass go mod verify: they are deleted, and the job downloads and builds without them. An entry that fails on every run stays until it is deleted (gh cache delete) or go.sum or the Dockerfile changes."
          chmod -R u+w -- "$cache"
          rm -rf -- "$cache"
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"

      # TARGETS names the targets, in the order they run; the first that fails stops the script.
      # cpu-off is the host's own build with cpu.all=off, at GOAMD64 v1 on amd64; amd64-v3 and 386
      # run on an amd64 host alone.
      - name: Tests on the targets
        env:
          TARGETS: ${{ matrix.target }}
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" --env HOME=/tmp --env TARGETS \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain bash -s - <<'SCRIPT'
          set -euo pipefail
          run() { echo "== $*" >&2; env "$@"; }
          read -r -a targets <<< "${TARGETS-}"
          if [ "${#targets[@]}" = 0 ]; then
              echo "targets: TARGETS names no target" >&2
              exit 1
          fi
          host=$(go env GOHOSTARCH)
          for target in "${targets[@]}"; do
              case $target in
                  amd64-v3 | 386)
                      if [ "$host" != amd64 ]; then
                          echo "targets: $target runs on an amd64 host, not on $host" >&2
                          exit 1
                      fi
                      ;;
              esac
              case $target in
                  amd64-v3) run GOAMD64=v3 go test -count=1 ./... ;;
                  cpu-off)
                      if [ "$host" = amd64 ]; then
                          run GOAMD64=v1 GODEBUG=cpu.all=off go test -count=1 ./...
                      else
                          run GODEBUG=cpu.all=off go test -count=1 ./...
                      fi
                      ;;
                  386) run GOARCH=386 go test -count=1 ./... ;;
                  js-wasm) run GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./... ;;
                  wasip1)
                      # wasip1 in node:wasi, by an executor written outside the checkout: the test
                      # binary with its arguments, the environment, where go test sets PWD to the
                      # package's folder, and the whole file system; the code wasi.start returns is
                      # the process's. Node has the stack go_js_wasm_exec gives it for js/wasm (R39).
                      wasi="$(mktemp -d)/go_wasip1_wasm_exec.mjs"
                      cat > "$wasi" <<'JS'
          import { readFile } from "node:fs/promises";
          import { WASI } from "node:wasi";
          const args = process.argv.slice(2);
          const wasi = new WASI({ version: "preview1", args, env: process.env, preopens: { "/": "/" }, returnOnExit: true });
          const { instance } = await WebAssembly.instantiate(await readFile(args[0]), wasi.getImportObject());
          process.exitCode = wasi.start(instance);
          JS
                      run GOOS=wasip1 GOARCH=wasm go test -count=1 -exec="node --stack-size=8192 --disable-warning=ExperimentalWarning $wasi" ./...
                      run GOOS=wasip1 GOARCH=wasm go vet ./...
                      ;;
                  *)
                      echo "targets: no target $target" >&2
                      exit 1
                      ;;
              esac
          done
          SCRIPT

      # The Go caches into the cache, as in the job check (R41).
      - name: Go caches into the cache
        if: steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # "Go / targets", the one check of the targets in the caller's ruleset: green when every job of
  # the matrix target passed, red otherwise — a target that failed, was cancelled or did not run
  # (R43). It runs whatever came before it, a cancelled run too, which a skipped check would pass
  # as "Success"; it checks nothing out and only reads the result, so nothing in it can hang.
  targets:
    name: targets
    needs: target
    if: ${{ always() && inputs.same-bits }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every target
        env:
          RESULT: ${{ needs.target.result }}
        run: |
          if [ "$RESULT" = success ]; then
              echo "targets: every target passed."
              exit 0
          fi
          echo "::error::The targets are ${RESULT:-of no result}, not success: the jobs \"target …\" of this run say which and why."
          exit 1

  # Each package of the caller's module with code is compiled for every target whose compiler fuses
  # a multiplication with an addition or a subtraction, twice: as it is, and with -d=fmahash=n,
  # which turns every rule of fusion off. The assembler must be the same, and the second build must
  # report no place where a rule would have fired, "fmahash triggered". A control of three shapes
  # the compiler fuses, one at least on every target, must differ on every target, or the check
  # has stopped seeing fusion; it is a module of its own, written here, so that a caller keeps
  # none. The output does not depend on the host. The check is learner-model's and engine's recipe
  # fma-diff (R107 in spec).
  fma-diff:
    name: fma-diff
    needs: toolchain
    if: ${{ !cancelled() && inputs.same-bits }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain stage from the cache or the job toolchain, as in the job check (R36, R42).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image from the job toolchain
        if: steps.toolchain.outputs.cache-hit != 'true' && needs.toolchain.outputs.artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.toolchain.outputs.artifact }}
          path: ${{ runner.temp }}

      - name: Toolchain image
        env:
          SAVE: "false"
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      # The Go caches from the cache, as in the job check (R41).
      - name: Go caches from the cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-fma-diff-${{ hashFiles('.devcontainer/Dockerfile') }}-${{ hashFiles('**/go.sum') }}

      # The three folders, empty on a miss. What the cache gave is checked first by go mod verify,
      # in every module of the caller — each go.mod git tracks outside testdata/, vendor/ and the
      # folders whose names start with . or _, which ./... leaves out too —: each module of their
      # builds is hashed again against the hash it was downloaded with, which go checks against
      # go.sum whenever it takes the module. A tool run by go run <module>@<version> go checks the
      # same way against the checksum database, but its folder no verify hashes: it is held, like
      # GOCACHE, by main's scope. A check that fails or cannot run costs the run its caches and not
      # its verdict: they are deleted with a warning, and the recipes download and build as with
      # none. Verified caches have their builds touched: go deletes a build it has not used for five
      # days, by its time, at the end of a command, and an entry keeps the times of its save, so
      # the first command of a job would delete what the next ones need (R41).
      - name: Go caches
        env:
          RESTORED: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: |
          cache=$RUNNER_TEMP/go-cache
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"
          if [ -z "$RESTORED" ]; then
              echo "Go caches: none in the cache; the job starts with empty ones."
              exit 0
          fi
          verified=false
          if git ls-files -z -- ':(glob)**/go.mod' ':(exclude,glob)**/testdata/**' ':(exclude,glob)**/vendor/**' \
              ':(exclude,glob)**/.*/**' ':(exclude,glob)**/_*/**' > "$RUNNER_TEMP/go-modules"; then
              modules=()
              while IFS= read -r -d '' file; do
                  modules+=("$(dirname -- "$file")")
              done < "$RUNNER_TEMP/go-modules"
              if [ "${#modules[@]}" = 0 ]; then
                  echo "Go caches: ${RESTORED}, with no module of the repository to verify them by."
                  verified=true
              elif docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
                  --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
                  --volume "$PWD:/work" --volume "$cache:/go-cache" --workdir /work \
                  novatrail-toolchain bash -c 'for module in "$@"; do go -C "$module" mod verify || exit; done' bash "${modules[@]}"; then
                  echo "Go caches: ${RESTORED}, its modules verified."
                  verified=true
              fi
          fi
          if [ "$verified" = true ]; then
              find "$cache/build" "$cache/lint" -type f -exec touch -c -- {} +
              exit 0
          fi
          echo "::warning::The Go caches of ${RESTORED} did not pass go mod verify: they are deleted, and the job downloads and builds without them. An entry that fails on every run stays until it is deleted (gh cache delete) or go.sum or the Dockerfile changes."
          chmod -R u+w -- "$cache"
          rm -rf -- "$cache"
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"

      - name: The assembler with fusion and without it
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain bash -s - <<'SCRIPT'
          set -euo pipefail
          control="$(mktemp -d)"
          printf 'module fmacontrol\n\ngo 1.21\n' > "$control/go.mod"
          cat > "$control/control.go" <<'GO'
          // Package fma is the control of fma-diff: the three shapes the compiler fuses, one of
          // which at least it fuses on every target the check compiles for.
          package fma

          // MulAdd is a*b + c: a fused multiply-add on every target that fuses.
          func MulAdd(a, b, c float64) float64 { return a*b + c }

          // QuarterAdd is x/4 + y: a division by a constant whose reciprocal is exact becomes a
          // multiplication, and fuses as one.
          func QuarterAdd(x, y float64) float64 { return x/4 + y }

          // MulSub is c - a*b: a fused multiply-subtract where the target has one; amd64 has none.
          func MulSub(a, b, c float64) float64 { return c - a*b }
          GO
          # The assembler of a package, by its flags, in the caller's module or in the one named. The
          # build writes no binary, a main package's neither, into the checkout. One that fails says
          # why, and the target fails, but the other packages and targets are still checked.
          asm() {
              local out
              local -a in=()
              if [ -n "${3-}" ]; then in=(-C "$3"); fi
              if ! out="$(go "${in[@]}" build -o /dev/null -gcflags="-S $1" "$2" 2>&1)"; then
                  echo "fma-diff: $target: $2 does not build:" >&2
                  echo "$out" >&2
                  return 1
              fi
              echo "$out"
          }
          # One target: its packages and the control, as a process of its own, which fails when
          # the target does.
          check() {
              local target=$1 ok=1 pkgs pkg fused plain
              export GOOS=linux GOARCH="${target%%/*}" GOAMD64=v1
              if [ "$target" = amd64/v3 ]; then GOAMD64=v3; fi
              # The packages with code for this target: one of tests alone has nothing to build, and
              # build constraints may leave a package out of a target.
              pkgs="$(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./...)"
              for pkg in $pkgs; do
                  if ! fused="$(asm "" "$pkg")" || ! plain="$(asm -d=fmahash=n "$pkg")"; then
                      ok=0
                      continue
                  fi
                  if [ "$fused" != "$plain" ] || grep -q 'fmahash triggered' <<<"$plain"; then
                      echo "fma-diff: $target: the compiler fuses in $pkg; put float64() round the * or / (R107 in spec):" >&2
                      diff <(echo "$fused") <(echo "$plain") | head -n 40 >&2 || true
                      ok=0
                  fi
              done
              if ! fused="$(asm "" . "$control")" || ! plain="$(asm -d=fmahash=n . "$control")"; then
                  ok=0
              elif [ "$fused" = "$plain" ]; then
                  echo "fma-diff: $target: the control was not caught: the check sees no fusion" >&2
                  ok=0
              fi
              if [ "$ok" = 1 ]; then echo "fma-diff: $target: ok" >&2; else return 1; fi
          }
          # The targets at once, each in the background with its output in a file of its own; then
          # each target's output, whole, in the order of the targets, as soon as it has ended (R43).
          targets=(arm64 ppc64le s390x riscv64 loong64 amd64/v3)
          logs="$(mktemp -d)"
          pids=()
          for i in "${!targets[@]}"; do
              check "${targets[$i]}" > "$logs/$i" 2>&1 &
              pids+=("$!")
          done
          status=0
          for i in "${!targets[@]}"; do
              if ! wait "${pids[$i]}"; then status=1; fi
              cat -- "$logs/$i" >&2
          done
          exit "$status"
          SCRIPT

      # The Go caches into the cache, as in the job check (R41).
      - name: Go caches into the cache
        if: steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # ci-test and the tests on the targets again, on an arm64 host, a free runner of a public repository
  # (sources 2.6): the caller's tests with the race detector and coverage, whose report goes
  # nowhere — the test job sends the one report — then the script of targets, which on a host other
  # than amd64 runs its own build with cpu.all=off, js/wasm and wasip1. fma-diff does not depend on
  # the host and does not run again. learner-model and engine ran this as a job of their own, "Go
  # arm64" (R107 in spec).
  arm64:
    name: arm64
    if: inputs.same-bits
    runs-on: ubuntu-24.04-arm
    # ci-test, which check gives 20 minutes, and the targets, which targets gives 30, one after the
    # other.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain stage from the cache, as in the job check, but on its own: the image of an
      # arm64 runner is no amd64 image, and the job toolchain builds none for it. On a miss it
      # builds the image, and only a push to main writes and saves its file (R36, R42).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        env:
          SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # The Go caches from the cache, as in the job check (R41).
      - name: Go caches from the cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-arm64-${{ hashFiles('.devcontainer/Dockerfile') }}-${{ hashFiles('**/go.sum') }}

      # The three folders, empty on a miss. What the cache gave is checked first by go mod verify,
      # in every module of the caller — each go.mod git tracks outside testdata/, vendor/ and the
      # folders whose names start with . or _, which ./... leaves out too —: each module of their
      # builds is hashed again against the hash it was downloaded with, which go checks against
      # go.sum whenever it takes the module. A tool run by go run <module>@<version> go checks the
      # same way against the checksum database, but its folder no verify hashes: it is held, like
      # GOCACHE, by main's scope. A check that fails or cannot run costs the run its caches and not
      # its verdict: they are deleted with a warning, and the recipes download and build as with
      # none. Verified caches have their builds touched: go deletes a build it has not used for five
      # days, by its time, at the end of a command, and an entry keeps the times of its save, so
      # the first command of a job would delete what the next ones need (R41).
      - name: Go caches
        env:
          RESTORED: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: |
          cache=$RUNNER_TEMP/go-cache
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"
          if [ -z "$RESTORED" ]; then
              echo "Go caches: none in the cache; the job starts with empty ones."
              exit 0
          fi
          verified=false
          if git ls-files -z -- ':(glob)**/go.mod' ':(exclude,glob)**/testdata/**' ':(exclude,glob)**/vendor/**' \
              ':(exclude,glob)**/.*/**' ':(exclude,glob)**/_*/**' > "$RUNNER_TEMP/go-modules"; then
              modules=()
              while IFS= read -r -d '' file; do
                  modules+=("$(dirname -- "$file")")
              done < "$RUNNER_TEMP/go-modules"
              if [ "${#modules[@]}" = 0 ]; then
                  echo "Go caches: ${RESTORED}, with no module of the repository to verify them by."
                  verified=true
              elif docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
                  --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
                  --volume "$PWD:/work" --volume "$cache:/go-cache" --workdir /work \
                  novatrail-toolchain bash -c 'for module in "$@"; do go -C "$module" mod verify || exit; done' bash "${modules[@]}"; then
                  echo "Go caches: ${RESTORED}, its modules verified."
                  verified=true
              fi
          fi
          if [ "$verified" = true ]; then
              find "$cache/build" "$cache/lint" -type f -exec touch -c -- {} +
              exit 0
          fi
          echo "::warning::The Go caches of ${RESTORED} did not pass go mod verify: they are deleted, and the job downloads and builds without them. An entry that fails on every run stays until it is deleted (gh cache delete) or go.sum or the Dockerfile changes."
          chmod -R u+w -- "$cache"
          rm -rf -- "$cache"
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"

      - name: ci-test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain just ci-test

      # TARGETS names the targets, in the order they run; the first that fails stops the script.
      # cpu-off is the host's own build with cpu.all=off, at GOAMD64 v1 on amd64; amd64-v3 and 386
      # run on an amd64 host alone.
      - name: Tests on the targets
        env:
          TARGETS: cpu-off js-wasm wasip1
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" --env HOME=/tmp --env TARGETS \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain bash -s - <<'SCRIPT'
          set -euo pipefail
          run() { echo "== $*" >&2; env "$@"; }
          read -r -a targets <<< "${TARGETS-}"
          if [ "${#targets[@]}" = 0 ]; then
              echo "targets: TARGETS names no target" >&2
              exit 1
          fi
          host=$(go env GOHOSTARCH)
          for target in "${targets[@]}"; do
              case $target in
                  amd64-v3 | 386)
                      if [ "$host" != amd64 ]; then
                          echo "targets: $target runs on an amd64 host, not on $host" >&2
                          exit 1
                      fi
                      ;;
              esac
              case $target in
                  amd64-v3) run GOAMD64=v3 go test -count=1 ./... ;;
                  cpu-off)
                      if [ "$host" = amd64 ]; then
                          run GOAMD64=v1 GODEBUG=cpu.all=off go test -count=1 ./...
                      else
                          run GODEBUG=cpu.all=off go test -count=1 ./...
                      fi
                      ;;
                  386) run GOARCH=386 go test -count=1 ./... ;;
                  js-wasm) run GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./... ;;
                  wasip1)
                      # wasip1 in node:wasi, by an executor written outside the checkout: the test
                      # binary with its arguments, the environment, where go test sets PWD to the
                      # package's folder, and the whole file system; the code wasi.start returns is
                      # the process's. Node has the stack go_js_wasm_exec gives it for js/wasm (R39).
                      wasi="$(mktemp -d)/go_wasip1_wasm_exec.mjs"
                      cat > "$wasi" <<'JS'
          import { readFile } from "node:fs/promises";
          import { WASI } from "node:wasi";
          const args = process.argv.slice(2);
          const wasi = new WASI({ version: "preview1", args, env: process.env, preopens: { "/": "/" }, returnOnExit: true });
          const { instance } = await WebAssembly.instantiate(await readFile(args[0]), wasi.getImportObject());
          process.exitCode = wasi.start(instance);
          JS
                      run GOOS=wasip1 GOARCH=wasm go test -count=1 -exec="node --stack-size=8192 --disable-warning=ExperimentalWarning $wasi" ./...
                      run GOOS=wasip1 GOARCH=wasm go vet ./...
                      ;;
                  *)
                      echo "targets: no target $target" >&2
                      exit 1
                      ;;
              esac
          done
          SCRIPT

      # The Go caches into the cache, as in the job check (R41).
      - name: Go caches into the cache
        if: steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The rules of code that keep the bits the same on every build — float64() round every * and /,
  # math and the imports by the lists, no cgo, assembler, linkname or build constraint, no map
  # range or goroutine in code, no require the lists do not name, no replace, no nested module —
  # held by the tool of .github, tools/coderules, which learner-model and engine kept each as a
  # rules_test.go of its own (R107 in spec; R33). The tool is .github's of the very commit this
  # workflow file comes from, job.workflow_sha, so that a caller pinned to a release runs the tool
  # of that release; it is built by the Go of the caller's toolchain stage, as the caller's code
  # is, and reads the caller's lists, .github/coderules.json. actions/checkout puts it in the
  # workspace alone, so the step moves it out before anything reads the caller's module, which
  # would hold it as a module nested in its own.
  rules:
    name: rules
    needs: toolchain
    if: ${{ !cancelled() && inputs.same-bits }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-github
          persist-credentials: false

      # The toolchain stage from the cache or the job toolchain, as in the job check (R36, R42).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image from the job toolchain
        if: steps.toolchain.outputs.cache-hit != 'true' && needs.toolchain.outputs.artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.toolchain.outputs.artifact }}
          path: ${{ runner.temp }}

      - name: Toolchain image
        env:
          SAVE: "false"
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      # The Go caches from the cache, as in the job check (R41).
      - name: Go caches from the cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-rules-${{ hashFiles('.devcontainer/Dockerfile') }}-${{ hashFiles('**/go.sum') }}

      # The three folders, empty on a miss. What the cache gave is checked first by go mod verify,
      # in every module of the caller — each go.mod git tracks outside testdata/, vendor/ and the
      # folders whose names start with . or _, which ./... leaves out too —: each module of their
      # builds is hashed again against the hash it was downloaded with, which go checks against
      # go.sum whenever it takes the module. A tool run by go run <module>@<version> go checks the
      # same way against the checksum database, but its folder no verify hashes: it is held, like
      # GOCACHE, by main's scope. A check that fails or cannot run costs the run its caches and not
      # its verdict: they are deleted with a warning, and the recipes download and build as with
      # none. Verified caches have their builds touched: go deletes a build it has not used for five
      # days, by its time, at the end of a command, and an entry keeps the times of its save, so
      # the first command of a job would delete what the next ones need (R41).
      - name: Go caches
        env:
          RESTORED: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: |
          cache=$RUNNER_TEMP/go-cache
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"
          if [ -z "$RESTORED" ]; then
              echo "Go caches: none in the cache; the job starts with empty ones."
              exit 0
          fi
          verified=false
          if git ls-files -z -- ':(glob)**/go.mod' ':(exclude,glob)**/testdata/**' ':(exclude,glob)**/vendor/**' \
              ':(exclude,glob)**/.*/**' ':(exclude,glob)**/_*/**' > "$RUNNER_TEMP/go-modules"; then
              modules=()
              while IFS= read -r -d '' file; do
                  modules+=("$(dirname -- "$file")")
              done < "$RUNNER_TEMP/go-modules"
              if [ "${#modules[@]}" = 0 ]; then
                  echo "Go caches: ${RESTORED}, with no module of the repository to verify them by."
                  verified=true
              elif docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
                  --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
                  --volume "$PWD:/work" --volume "$cache:/go-cache" --workdir /work \
                  novatrail-toolchain bash -c 'for module in "$@"; do go -C "$module" mod verify || exit; done' bash "${modules[@]}"; then
                  echo "Go caches: ${RESTORED}, its modules verified."
                  verified=true
              fi
          fi
          if [ "$verified" = true ]; then
              find "$cache/build" "$cache/lint" -type f -exec touch -c -- {} +
              exit 0
          fi
          echo "::warning::The Go caches of ${RESTORED} did not pass go mod verify: they are deleted, and the job downloads and builds without them. An entry that fails on every run stays until it is deleted (gh cache delete) or go.sum or the Dockerfile changes."
          chmod -R u+w -- "$cache"
          rm -rf -- "$cache"
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"

      # The tool's own module is mounted read-only, and the binary goes to the container's /tmp.
      - name: The rules of code
        run: |
          mv .shared-github "$RUNNER_TEMP/shared-github"
          if [ ! -f .github/coderules.json ]; then
              echo "::error::same-bits holds the code to the rules of code by the caller's lists, .github/coderules.json, and there is none (architecture 3.3 of .github)."
              exit 1
          fi
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              --volume "$RUNNER_TEMP/shared-github/tools/coderules:/tool:ro" \
              novatrail-toolchain bash -c 'go -C /tool build -o /tmp/coderules . && /tmp/coderules -lists .github/coderules.json .'

      # The Go caches into the cache, as in the job check (R41).
      - name: Go caches into the cache
        if: steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
