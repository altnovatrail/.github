# Shared check (R03, R16): the Go code of the repository that calls it, by four recipes of that
# repository's own — ci-lint, ci-test, ci-vuln and ci-licenses — one job each, in the toolchain
# stage of the caller's .devcontainer/Dockerfile, where the caller pins its Go; the recipes pin
# the versions of the tools they run. What the checks do is the repository's; how they are run is
# the same everywhere (R30 in spec). Each job is a check of the caller's ruleset of main:
# "Go / lint", "Go / test", "Go / vuln" and "Go / licenses", when the calling job is named Go.
#
# ci-test writes the coverage of the tests as one Go coverage profile, coverage/go.out, and the
# job coverage sends it to Codecov by OIDC, with no secret (R48 in spec). "Go / coverage" is no
# check of the ruleset: codecov/patch, which Codecov sets from the upload, is.
#
# ci-licenses is handed the licenses a NovaTrail repository may build from: the ASF's Category A
# as SPDX identifiers, the list spec checks its own tools against (R12 in spec). It lives here,
# where a change to it is a change to this workflow and so a release (architecture 2.7), and
# self-ci.yml holds it to spec's own list at the tag .github is on. A repository's exceptions are
# its recipe's, each with its decision.
#
# Each job that runs in the toolchain stage takes its image from the caller's cache of GitHub
# Actions and builds it from the Dockerfile only on a miss, so that an outage of what the Dockerfile
# downloads from does not fail the checks while the Dockerfile stays the same (R36).
#
# With same-bits, four more jobs hold the caller's bits the same on every build (R107 in spec), as
# learner-model and engine held them each in a recipe of its own (R09 learner-model; R10 engine).
# "Go / targets" runs the tests on the builds where the bits are most at risk, and builds and vets
# wasip1; "Go / fma-diff" compares the assembler of each package with fusion and without it, with a
# control of its own here; "Go / arm64" runs ci-test and the targets of its host on an arm64
# runner; "Go / rules" holds the code to the rules of code by the tool tools/coderules of .github,
# of this workflow's own version, and the caller's lists, .github/coderules.json (R33). Without the
# input the workflow is what it was.
#
# .github's own Go code is the tool of the rules of code alone, which self-ci.yml checks by this
# workflow without same-bits: a change here is tried from a Go repository's pull request that calls
# this file by the SHA of the branch, or by a trial pull request of .github that calls it by local
# path and is never merged, before the release (R16).
# Called from a job that gives it `contents: read` and `id-token: write`: the coverage job alone
# asks for the token, and a called workflow can only lower what its caller gives.

name: Go (shared)

on:
  workflow_call:
    inputs:
      same-bits:
        description: Hold the bits the same on every build, by "Go / targets", "Go / fma-diff", "Go / arm64" and "Go / rules" (R107 in spec).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    # Named after the check, so that each reads "<calling job> / <check>": "Go / lint" for ci-lint.
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every check reports on its own, rather than the first one to fail cancelling the rest.
      fail-fast: false
      matrix:
        check: [lint, test, vuln, licenses]
    steps:
      # Without the spec submodule: code takes spec's files from spec's releases, not from the
      # submodule (R21 in spec), so a check that reads spec/ fails here as it would for a user.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image of the toolchain stage comes from the cache of GitHub Actions, as spec decided for
      # the stage in CI and canvas does (R36; the amendment of 2026-11-09 to R31 in spec; R57
      # canvas): a file of docker save, by the key of the runner's OS and architecture and the hash
      # of the Dockerfile. The Dockerfile pins everything it installs, by version and sum (R34, R40
      # in spec), so the image from the cache is the one it would build, and on a hit it does not
      # run: nodejs.org, GitHub and the snapshot of Ubuntu's archive are not asked. On a miss the
      # image is built and saved at once, so that a check that fails later still fills the cache.
      # The caches are the caller's: one a pull request saves is "restored by re-runs of the pull
      # request" alone, and the one of main, which every pull request reads, its CI on a push to
      # main saves. A file that does not load as the image toolchain, or an image that cannot be
      # saved, costs the run its speed, not its verdict. The file lies outside the checkout, where
      # the recipes do not see it. Its path is not toolchain.sh's, so the entry is this workflow's
      # own under the same key ("Cache Version" in the README of actions/cache), and a change to how
      # the step builds the image takes a new path, which the entries of the old one do not match.
      # The Dockerfile copies nothing from the repository, so it is built without a context, as
      # documents.yml builds it.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: |
          tar=$RUNNER_TEMP/toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of the toolchain stage does not load as the image toolchain: the image is built from the Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # As in documents.yml, the container runs as the runner's user: what it writes in the
      # checkout is the runner's, and git finds the repository owned by the user it runs as. Its
      # home is /tmp, where Go keeps its module and build caches for this job alone. Of the
      # step's environment only ALLOWED_LICENSES goes in.
      - name: ci-${{ matrix.check }}
        env:
          RECIPE: ci-${{ matrix.check }}
          ALLOWED_LICENSES: 0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC0-1.0,ISC,MIT,MIT-0,Unlicense
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env ALLOWED_LICENSES \
              --volume "$PWD:/work" --workdir /work \
              toolchain just "$RECIPE"

      # The test job hands the report its recipe wrote to the coverage job, the one job that may ask
      # for an OIDC token: this one runs the code under test. A recipe that wrote none fails
      # "Go / test", as it owes one (R16). The report is kept a week, so that the coverage job can
      # be run again after an outage of Codecov. The name is the wrapper's own: an artifact's name
      # is unique in a run, and the caller's own jobs may upload one called coverage, as spec's do.
      - name: Coverage report
        if: matrix.check == 'test'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage/go.out
          retention-days: 7
          if-no-files-found: error

  # Codecov takes the report by OIDC, with no secret (R48 in spec). This job alone may ask GitHub for
  # the token, which only Codecov accepts and which grants nothing in the repository, and it runs
  # none of the repository's code. A pull request from a fork gets no token: the action then sends
  # the report without one, as Codecov takes it from a fork's branch. The job waits for the four
  # checks of check, as spec's upload does — not for the jobs of same-bits, which hand it no report.
  # A red one holds the merge anyway.
  #
  # Any failure of the job fails a pull request, so that a missing codecov/patch has its reason in
  # sight. Elsewhere, on main, it does not fail the run: the caller's release waits for CI to pass,
  # and an outage of Codecov must not hold it back.
  coverage:
    name: coverage
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # The files of the commit, which the upload lists so that Codecov can match the report's paths
      # to them; without the spec submodule, as the checks. Which commit and pull request the report
      # is for, the action takes from the event.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-coverage
          path: coverage

      # The Codecov CLI at an exact version, checked against its SHA-256 here, as the tools of
      # self-ci.yml are (R08), rather than against a key the action would fetch during the run. The
      # sum is the one the release's codecov.SHA256SUM gives, whose signature checks against the key
      # Codecov's docs name by its fingerprint. Dependabot moves the actions' SHAs alone: the
      # version and its sum are raised by hand, together, and in typescript.yml too.
      - name: Codecov CLI
        env:
          CLI_VERSION: v11.3.2
          CLI_SHA256: 8e1bfb71661378530f6ea21e82b414095899e565cbb4cf555c613064be17b973
        run: |
          cli="$RUNNER_TEMP/codecov"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$cli" "https://cli.codecov.io/${CLI_VERSION}/linux/codecov"
          echo "${CLI_SHA256}  ${cli}" | sha256sum --check --strict
          chmod +x "$cli"

      # The one report alone: no search for others, and no plugins, which would run coverage tools
      # of their own. A failed upload fails the job, as any of its steps does.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: coverage/go.out
          disable_search: true
          plugins: noop
          disable_telem: true
          fail_ci_if_error: true

  # The caller's tests again, without the race detector and coverage, which Go does not have on 386
  # and wasm: on amd64 with GOAMD64 v3, where the compiler fuses an addition; with v1 and
  # GODEBUG=cpu.all=off, with no processor extension for the runtime and the standard library to
  # pick their path by; on 386; and in js/wasm, in the Node of the toolchain stage. A host other
  # than amd64 runs no amd64 build and none for 386, and runs its own build with cpu.all=off.
  # wasip1 is built and vetted alone: the toolchain stage has no WASI runtime. The list is
  # learner-model's and engine's recipe test-targets (R107 in spec), and the script goes to the
  # container on stdin, so that one container keeps the build cache from run to run.
  targets:
    name: targets
    if: inputs.same-bits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain stage from the cache, as in the job check (R36).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: |
          tar=$RUNNER_TEMP/toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of the toolchain stage does not load as the image toolchain: the image is built from the Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Tests on the targets
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain bash -s - <<'SCRIPT'
          set -euo pipefail
          run() { echo "== $*" >&2; env "$@"; }
          if [ "$(go env GOHOSTARCH)" = amd64 ]; then
              run GOAMD64=v3 go test -count=1 ./...
              run GOAMD64=v1 GODEBUG=cpu.all=off go test -count=1 ./...
              run GOARCH=386 go test -count=1 ./...
          else
              run GODEBUG=cpu.all=off go test -count=1 ./...
          fi
          run GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./...
          run GOOS=wasip1 GOARCH=wasm go build ./...
          run GOOS=wasip1 GOARCH=wasm go vet ./...
          SCRIPT

  # Each package of the caller's module with code is compiled for every target whose compiler fuses
  # a multiplication with an addition or a subtraction, twice: as it is, and with -d=fmahash=n,
  # which turns every rule of fusion off. The assembler must be the same, and the second build must
  # report no place where a rule would have fired, "fmahash triggered". A control of three shapes
  # the compiler fuses, one at least on every target, must differ on every target, or the check
  # has stopped seeing fusion; it is a module of its own, written here, so that a caller keeps
  # none. The output does not depend on the host. The check is learner-model's and engine's recipe
  # fma-diff (R107 in spec).
  fma-diff:
    name: fma-diff
    if: inputs.same-bits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain stage from the cache, as in the job check (R36).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: |
          tar=$RUNNER_TEMP/toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of the toolchain stage does not load as the image toolchain: the image is built from the Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: The assembler with fusion and without it
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain bash -s - <<'SCRIPT'
          set -euo pipefail
          control="$(mktemp -d)"
          printf 'module fmacontrol\n\ngo 1.21\n' > "$control/go.mod"
          cat > "$control/control.go" <<'GO'
          // Package fma is the control of fma-diff: the three shapes the compiler fuses, one of
          // which at least it fuses on every target the check compiles for.
          package fma

          // MulAdd is a*b + c: a fused multiply-add on every target that fuses.
          func MulAdd(a, b, c float64) float64 { return a*b + c }

          // QuarterAdd is x/4 + y: a division by a constant whose reciprocal is exact becomes a
          // multiplication, and fuses as one.
          func QuarterAdd(x, y float64) float64 { return x/4 + y }

          // MulSub is c - a*b: a fused multiply-subtract where the target has one; amd64 has none.
          func MulSub(a, b, c float64) float64 { return c - a*b }
          GO
          # The assembler of a package, by its flags, in the caller's module or in the one named. The
          # build writes no binary, a main package's neither, into the checkout. One that fails says
          # why, and the target fails, but the other packages and targets are still checked.
          asm() {
              local out
              local -a in=()
              if [ -n "${3-}" ]; then in=(-C "$3"); fi
              if ! out="$(go "${in[@]}" build -o /dev/null -gcflags="-S $1" "$2" 2>&1)"; then
                  echo "fma-diff: $target: $2 does not build:" >&2
                  echo "$out" >&2
                  return 1
              fi
              echo "$out"
          }
          status=0
          for target in arm64 ppc64le s390x riscv64 loong64 amd64/v3; do
              export GOOS=linux GOARCH="${target%%/*}" GOAMD64=v1
              if [ "$target" = amd64/v3 ]; then GOAMD64=v3; fi
              ok=1
              # The packages with code for this target: one of tests alone has nothing to build, and
              # build constraints may leave a package out of a target.
              pkgs="$(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./...)"
              for pkg in $pkgs; do
                  if ! fused="$(asm "" "$pkg")" || ! plain="$(asm -d=fmahash=n "$pkg")"; then
                      ok=0
                      continue
                  fi
                  if [ "$fused" != "$plain" ] || grep -q 'fmahash triggered' <<<"$plain"; then
                      echo "fma-diff: $target: the compiler fuses in $pkg; put float64() round the * or / (R107 in spec):" >&2
                      diff <(echo "$fused") <(echo "$plain") | head -n 40 >&2 || true
                      ok=0
                  fi
              done
              if ! fused="$(asm "" . "$control")" || ! plain="$(asm -d=fmahash=n . "$control")"; then
                  ok=0
              elif [ "$fused" = "$plain" ]; then
                  echo "fma-diff: $target: the control was not caught: the check sees no fusion" >&2
                  ok=0
              fi
              if [ "$ok" = 1 ]; then echo "fma-diff: $target: ok" >&2; else status=1; fi
          done
          exit "$status"
          SCRIPT

  # ci-test and the tests on the targets again, on an arm64 host, a free runner of a public repository
  # (architecture 4): the caller's tests with the race detector and coverage, whose report goes
  # nowhere — the test job sends the one report — then the script of targets, which on a host other
  # than amd64 runs its own build with cpu.all=off, js/wasm and wasip1. fma-diff does not depend on
  # the host and does not run again. learner-model and engine ran this as a job of their own, "Go
  # arm64" (R107 in spec).
  arm64:
    name: arm64
    if: inputs.same-bits
    runs-on: ubuntu-24.04-arm
    # ci-test, which check gives 20 minutes, and the targets, which targets gives 30, one after the
    # other.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain stage from the cache, as in the job check (R36).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: |
          tar=$RUNNER_TEMP/toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of the toolchain stage does not load as the image toolchain: the image is built from the Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: ci-test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just ci-test

      - name: Tests on the targets
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain bash -s - <<'SCRIPT'
          set -euo pipefail
          run() { echo "== $*" >&2; env "$@"; }
          if [ "$(go env GOHOSTARCH)" = amd64 ]; then
              run GOAMD64=v3 go test -count=1 ./...
              run GOAMD64=v1 GODEBUG=cpu.all=off go test -count=1 ./...
              run GOARCH=386 go test -count=1 ./...
          else
              run GODEBUG=cpu.all=off go test -count=1 ./...
          fi
          run GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./...
          run GOOS=wasip1 GOARCH=wasm go build ./...
          run GOOS=wasip1 GOARCH=wasm go vet ./...
          SCRIPT

  # The rules of code that keep the bits the same on every build — float64() round every * and /,
  # math and the imports by the lists, no cgo, assembler, linkname or build constraint, no map
  # range or goroutine in code, no require the lists do not name, no replace, no nested module —
  # held by the tool of .github, tools/coderules, which learner-model and engine kept each as a
  # rules_test.go of its own (R107 in spec; R33). The tool is .github's of the very commit this
  # workflow file comes from, job.workflow_sha, so that a caller pinned to a release runs the tool
  # of that release; it is built by the Go of the caller's toolchain stage, as the caller's code
  # is, and reads the caller's lists, .github/coderules.json. actions/checkout puts it in the
  # workspace alone, so the step moves it out before anything reads the caller's module, which
  # would hold it as a module nested in its own.
  rules:
    name: rules
    if: inputs.same-bits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-github
          persist-credentials: false

      # The toolchain stage from the cache, as in the job check (R36).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: |
          tar=$RUNNER_TEMP/toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of the toolchain stage does not load as the image toolchain: the image is built from the Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # The tool's own module is mounted read-only, and the binary goes to the container's /tmp.
      - name: The rules of code
        run: |
          mv .shared-github "$RUNNER_TEMP/shared-github"
          if [ ! -f .github/coderules.json ]; then
              echo "::error::same-bits holds the code to the rules of code by the caller's lists, .github/coderules.json, and there is none (architecture 3.3 of .github)."
              exit 1
          fi
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              --volume "$RUNNER_TEMP/shared-github/tools/coderules:/tool:ro" \
              toolchain bash -c 'go -C /tool build -o /tmp/coderules . && /tmp/coderules -lists .github/coderules.json .'
