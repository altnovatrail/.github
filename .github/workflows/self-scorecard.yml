# OpenSSF Scorecard over .github itself: the shared scorecard.yml, called by local path. It
# runs on main and once a week, as the action supports, and holds no merge.
#
# This file keeps to the Scorecard server's rules for the workflow that publishes, in case the
# server checks the caller's file too: nothing at the top but read permission, no `env` or
# `defaults`. A green job does not say the server accepted the result: read it on the Scorecard
# server.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/scorecard.yml
