# Shared check: the caller's documents, by the docs-check of the spec it pins as its
# submodule, `just -f spec/justfile docs-check-repo`. spec runs its own `just
# docs-check` instead.
#
# It runs in the stage toolchain-core of the caller's .devcontainer/Dockerfile where it has one,
# and in toolchain otherwise, by spec's script tools/toolchain/toolchain.sh of the
# submodule, as spec's CI and the shared release run it, so that a check green locally is green
# here. The image comes from the caller's cache by the key and the file go.yml's jobs
# use, built only on a miss and saved only from a push to main. A script of an older
# spec, which reads no TOOLCHAIN_STAGE, builds toolchain, which holds all the core does: an entry
# of the core may then hold toolchain, which costs its size and no verdict.
#
# Called from a job that gives it `contents: read`.

name: Documents (shared)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-check-repo:
    name: docs-check-repo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # With the spec submodule: the check reads spec's documents at the tag the caller pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # toolchain-core where the Dockerfile has one that holds less than toolchain, by the reading
      # of go.yml's and typescript.yml's job toolchain, and toolchain otherwise.
      - name: Toolchain stages
        id: stages
        run: |
          core=toolchain
          if [ -f .devcontainer/Dockerfile ] && awk '
              { sub(/\r$/, "") }
              /^[[:space:]]*(#|$)/ { next }
              toupper($1) == "FROM" {
                  stage = (NF >= 4 && toupper($(NF - 1)) == "AS") ? tolower($NF) : ""
                  if (stage == "toolchain-core") core = 1
                  if (stage == "toolchain" && tolower($(NF - 2)) != "toolchain-core") adds = 1
                  next
              }
              stage == "toolchain" && toupper($1) != "SHELL" { adds = 1 }
              END { exit !(core && adds) }
          ' .devcontainer/Dockerfile; then
              core=toolchain-core
          fi
          echo "The checks without a browser run in the stage ${core}."
          echo "core=${core}" >> "$GITHUB_OUTPUT"

      # The key, the file and the image go.yml's jobs and spec's CI give the stage, so that the
      # caller keeps one entry a stage for all of them. The build is a step of its
      # own, so that a red check still fills the cache.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-${{ steps.stages.outputs.core }}.tar
          key: ${{ steps.stages.outputs.core }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      # A run that saves nothing hands the script no file it would only write and drop: without
      # one from the cache, the script only builds. A script of a spec older than v0.13.0 writes no
      # file, and the save then only warns.
      - name: Toolchain image
        env:
          TOOLCHAIN_STAGE: ${{ steps.stages.outputs.core }}
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-${{ steps.stages.outputs.core }}.tar
          SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ ! -f spec/tools/toolchain/toolchain.sh ] || [ ! -x spec/tools/toolchain/toolchain.sh ]; then
              echo "::error::spec/ has no executable tools/toolchain/toolchain.sh, which spec ships from v0.2.17 (R31 spec): move the spec submodule to v0.2.17 or newer, then run the check again."
              exit 1
          fi
          if [ "$SAVE" != true ] && [ ! -f "$TOOLCHAIN_IMAGE_FILE" ]; then
              unset TOOLCHAIN_IMAGE_FILE
          fi
          spec/tools/toolchain/toolchain.sh build

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-${{ steps.stages.outputs.core }}.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # spec's script runs spec's recipe in the stage, as the runner's user, so that what it writes
      # in the checkout is the runner's and git finds the repository owned by the user it runs as.
      - name: Documents
        run: spec/tools/toolchain/toolchain.sh spec docs-check-repo
