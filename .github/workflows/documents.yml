# Shared check (R03): the documents of the repository that calls it, with the docs-check of the
# spec it pins as its submodule — `just -f spec/justfile docs-check-repo` (R32 in spec). spec
# itself does not call it: its own CI runs `just docs-check`.
#
# It runs in the toolchain stage of the caller's .devcontainer/Dockerfile, with the Node and just
# of the caller's devcontainer, as spec's CI runs its checks: a check that is green locally is
# green here. Both the stage and the submodule come with every repository from spec's template.
# How the stage is built and how a recipe runs in it are spec's, in the script
# spec/tools/toolchain/toolchain.sh of the submodule, at the tag the caller pins, as spec's CI and
# the shared release run them (R31 in spec; the 2026-11-08 amendment to R08): spec ships it from
# v0.2.17, and a submodule older than that stops the check with the reason.
# Called from a job that gives it `contents: read`.

name: Documents (shared)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-check-repo:
    name: docs-check-repo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # With the spec submodule: the check reads spec's documents at the tag the caller pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # spec's script builds the stage and runs spec's recipe in it, as the runner's user, so that
      # what it writes in the checkout is the runner's and git finds the repository owned by the
      # user it runs as.
      - name: Documents
        run: |
          if [ ! -f spec/tools/toolchain/toolchain.sh ] || [ ! -x spec/tools/toolchain/toolchain.sh ]; then
              echo "::error::spec/ has no executable tools/toolchain/toolchain.sh, which spec ships from v0.2.17 (R31 in spec): move the spec submodule to v0.2.17 or newer, then run the check again."
              exit 1
          fi
          spec/tools/toolchain/toolchain.sh build
          spec/tools/toolchain/toolchain.sh spec docs-check-repo
