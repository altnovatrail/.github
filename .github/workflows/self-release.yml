# .github's own release (R04, R10, R12), as spec's (R31 in spec): what a green main produces when a
# shared workflow has changed. Nobody tags by hand: the version is the next patch of the line
# the releases are numbered in, and the tag is created with the release. The callers pin a
# shared workflow by the SHA of a release, with its version beside it (R04).
#
# A commit gets a release only when a shared workflow — a file of .github/workflows/ without the
# self- prefix — has changed since the release before it; the first release comes out always.
# A release of a profile, a community file, a self- workflow or a document would only bring
# every caller a pull request for a workflow that did not change (architecture 3.5).
#
# The releases are immutable, so the tag stays on its commit for good, and GitHub signs each
# release with an attestation of its tag and commit, which `gh release verify` checks.
#
# The button runs the same for the tip of main — after a release run that failed, say: it
# releases the tip when the tip has no release yet and a shared workflow has changed since the
# last one. It works on main alone, and only once CI has passed on that commit.
#
# The version is worked out on every green commit of main, released or not, with the toolchain,
# spec and RELEASE_LINE of the tip the run checks out. A change that breaks the step — a new tag
# of spec whose release-version recipe takes other arguments, say — turns red the first run
# that checks it out: that of the commit that brought it, or of an older one whose CI ended later.

name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The line the releases are numbered in: the major and minor version every release carries, the
# patch counting up within it. The step that works out the version reads it from this text, so
# it may be quoted or not, and hands it to spec's recipe.
# Raising it releases nothing by itself: the new line starts with the next change to a shared
# workflow.
env:
  RELEASE_LINE: "0.1"

jobs:
  release:
    name: Release
    # Releases queue rather than overlap: each has to see the version the one before it
    # published before it can work out the next. queue: max keeps up to 100 runs pending, where
    # the default, single, keeps one (GitHub Docs, Workflow syntax, concurrency, read
    # 2026-10-20). actionlint does not know the key yet: .github/actionlint.yaml.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    # Only from a commit the checks have passed on, and only when that commit is this
    # repository's own: the branch filter above matches the name of a fork's branch as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # As in spec's release: bash with pipefail, so that a pipeline a step comes to have fails with
    # any of its commands, where a runner's default, bash -e, would look at the last one alone.
    defaults:
      run:
        shell: bash
    # The commit the checks ran on, which this run releases: the commit of the CI run, or the tip
    # of main for the button. Set once for every step, so that the commit the version step checks
    # is the commit the release is created at.
    env:
      TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      # Creating the release, and its tag with it.
      contents: write
      # Reading whether CI passed on the commit the button would release.
      actions: read
    steps:
      # Asked before anything of the repository is fetched: a run on another branch publishes
      # nothing, and neither does a commit whose CI on main has not finished green.
      - name: Whether this commit may be released by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release is published from main alone, and this run is on ${GITHUB_REF}."
              exit 1
          fi
          passed=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/self-ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f status=success \
              --jq '.total_count')
          if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed on ${GITHUB_SHA}. A release waits for its checks, and follows them by itself once they pass."
              exit 1
          fi

      # The tip of main the event saw, GITHUB_SHA, with every tag, and spec as its submodule. This
      # file was read from that commit too, so the step below, the toolchain stage, spec's
      # recipe and RELEASE_LINE all come from one commit. The commit the checks ran on, TARGET,
      # is in its history, which main's ruleset keeps from being rewritten, and is named by its SHA
      # alone: the release needs no checkout of it — git diff reads its tree from the history —
      # and a checkout by a ref of the workflow_run event is what Scorecard's Dangerous-Workflow
      # flags (R12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      # The number comes from spec's own recipe, release-version, run as spec's release runs it: in
      # the toolchain stage, with the Node, git and just of the devcontainer (R31 in spec). It is
      # handed TARGET and counts this repository's tags; outside spec it takes the line from
      # RELEASE_LINE. That is read from the text of this file, as set above — the line of the tip
      # this file was read from (R12) — by spec's line.mjs, as spec's recipe reads its own
      # release.yml: through the parsed env, an unquoted 0.10 would arrive as 0.1. Nothing of
      # this step's environment goes into the container. TARGET has to be a full SHA in the
      # history of the checkout, which spec's recipe does not ask. The git diff against the
      # release before runs with the runner's git, as the shared checks do (R08). The step's
      # outputs: version — empty when there is nothing to release — previous, the release
      # before, where the notes and the diff start, and released, the release TARGET has
      # already. behind, the newest release when TARGET is older than it, is only checked here.
      # A tag with no release behind it was pushed by hand: on TARGET, as the release before, or
      # as the newest "release" off main's history, it would stop releases quietly, so the run
      # stops on it instead.
      - id: version
        name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The commit to release is not a full SHA: \"${TARGET}\"."
              exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              echo "::error::A shallow clone has no tags to count from: fetch the whole history."
              exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET" HEAD; then
              echo "::error::${TARGET} is not in the history of the checkout, $(git rev-parse HEAD)."
              exit 1
          fi
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          # The script is in single quotes, so no apostrophe may appear in it.
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work toolchain bash -c \
              'RELEASE_LINE=$(node spec/tools/release/line.mjs < .github/workflows/self-release.yml) &&
               export RELEASE_LINE && exec just -f spec/justfile release-version "$1"' \
              release-version "$TARGET" > "$RUNNER_TEMP/release-version"
          cat "$RUNNER_TEMP/release-version"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release-version")
          previous=$(sed -n 's/^previous=//p' "$RUNNER_TEMP/release-version")
          released=$(sed -n 's/^released=//p' "$RUNNER_TEMP/release-version")
          behind=$(sed -n 's/^behind=//p' "$RUNNER_TEMP/release-version")
          for tag in $released $behind $previous; do
              if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null; then
                  echo "::error::${tag} has no release behind it: a tag pushed by hand. Tags come from this workflow alone (R04)."
                  exit 1
              fi
          done
          # A shared workflow is a file of .github/workflows/ without the self- prefix. A file
          # that a shared workflow comes to read from .github joins this list with it. git diff
          # --quiet exits 1 on a change and 0 on none; anything else is its own failure.
          if [ -n "$version" ] && [ -n "$previous" ]; then
              changed=0
              git diff --quiet "$previous" "$TARGET" -- .github/workflows/ ':(exclude).github/workflows/self-*' || changed=$?
              if [ "$changed" = 0 ]; then
                  echo "::notice::No shared workflow has changed since ${previous}: nothing to release."
                  version=""
              elif [ "$changed" != 1 ]; then
                  echo "::error::git diff could not compare ${previous} with ${TARGET}."
                  exit 1
              fi
          fi
          if [ -n "$version" ]; then
              echo "releasing $version at $TARGET"
          elif [ -n "$released" ] || [ -n "$behind" ]; then
              echo "::notice::Nothing to publish: ${TARGET} is released already, or is older than the newest release."
          fi
          {
              echo "version=${version}"
              echo "previous=${previous}"
              echo "released=${released}"
          } >> "$GITHUB_OUTPUT"

      # Every release is marked Latest: its number is the highest so far, since a release never
      # comes out below the newest one, and, unlike spec's, the tip of main may get no release of
      # its own when it changes no shared workflow. The notes run from the release before this
      # one. The Releases API refuses GITHUB_TOKEN a commit that "adds or modifies any file under
      # .github/workflows/ relative to the repository's default branch", with 404 or, on some
      # paths, 403 "Resource not accessible by integration" (GitHub Docs, REST releases, read
      # 2026-10-20): a commit that is no longer the tip then waits for the next release, which
      # covers it, since the change it brought is still there since the release before.
      - id: publish
        name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          if ! gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$VERSION" \
              --latest \
              --generate-notes "${start[@]}" 2> "$RUNNER_TEMP/release-create.err"; then
              cat "$RUNNER_TEMP/release-create.err" >&2
              # Only the documented refusal is let pass, as in spec's release: of a commit that
              # is no longer the tip and adds or modifies a workflow file relative to it. main is
              # fetched again after the refusal: a commit merged meanwhile is what makes this one
              # older. git diff --quiet exits 1 on a difference and 0 on none; anything else is
              # its own failure.
              git fetch --quiet --no-tags --no-recurse-submodules origin refs/heads/main
              tip=$(git rev-parse FETCH_HEAD)
              changed=0
              git diff --quiet --diff-filter=AM "$tip" "$TARGET" -- .github/workflows/ || changed=$?
              if [ "$tip" = "$TARGET" ] || [ "$changed" != 1 ] \
                  || ! grep -qE 'HTTP 404|HTTP 403: Resource not accessible by integration' "$RUNNER_TEMP/release-create.err"; then
                  exit 1
              fi
              echo "::warning::${TARGET} is no longer the tip of main (${tip}) and adds or modifies its workflow files, and the Releases API refused it; the release of the tip covers it."
              exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The release is immutable and attested; the attestation may take a moment to appear. A
      # run again of a commit released already verifies its release, so that a run that failed
      # here does not turn green on a second try without it.
      - name: Verify the release
        if: steps.publish.outputs.published == 'true' || steps.version.outputs.released != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
        run: |
          for attempt in 1 2 3 4 5; do
              if gh release verify "$VERSION" --repo "$GITHUB_REPOSITORY"; then exit 0; fi
              echo "attempt $attempt: not verified yet"
              sleep 10
          done
          echo "::error::${VERSION} is published, but its attestation does not verify."
          exit 1
