# .github's own release, as spec's: what a green main produces when a
# shared workflow, a shared action or the tool a shared workflow builds of its own version has
# changed since the release before; the first release comes out always. A release of
# anything else would only bring every caller a pull request for a workflow that did not change.
# Nobody tags by hand: the tag is created with the release, which is immutable, and GitHub attests
# its tag and commit. The callers pin a shared workflow or action by the SHA of a release, with its
# version beside it.
#
# The button releases the tip of main, after a release run that failed, say: on main alone, and
# only once CI has passed on that commit.
#
# The version is worked out on every green commit of main, released or not, with the toolchain
# and spec of the tip the run checks out. A tag of spec whose release-version or release-refusal
# takes other arguments turns red the first run that checks it out: that of the commit that
# brought it, or of an older one whose CI ended later.

name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The major and minor version of every release. spec's release-version reads it from this file as
# text, at the commit it numbers, so it may be quoted or not. Raising it releases nothing by
# itself: the new line starts with the next change to a shared workflow.
env:
  RELEASE_LINE: "0.1"

jobs:
  release:
    name: Release
    # Releases queue rather than overlap: each has to see the version the one before it
    # published before it can work out the next. queue: max keeps up to 100 runs pending, where
    # the default keeps one; actionlint does not know the key: .github/actionlint.yaml.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    # Only from a commit the checks have passed on, and only when that commit is this
    # repository's own: the branch filter above matches the name of a fork's branch as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # As in spec's release: bash with pipefail, so that a pipeline a step comes to have fails with
    # any of its commands, where a runner's default, bash -e, would look at the last one alone.
    defaults:
      run:
        shell: bash
    # Set once for every step, so that the commit the version step checks is the commit the
    # release is created at.
    env:
      TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      # Creating the release, and its tag with it.
      contents: write
      # Reading whether CI passed on the commit the button would release.
      actions: read
    steps:
      # Asked before anything of the repository is fetched: a run on another branch publishes
      # nothing, and neither does a commit whose CI on main has not finished green.
      - name: Whether this commit may be released by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release is published from main alone, and this run is on ${GITHUB_REF}."
              exit 1
          fi
          passed=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/self-ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f status=success \
              --jq '.total_count')
          if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed on ${GITHUB_SHA}. A release waits for its checks, and follows them by itself once they pass."
              exit 1
          fi

      # The tip of main the event saw, GITHUB_SHA: this file was read from it too, so the steps,
      # the toolchain stage and spec's recipes all come from one commit. TARGET, in its
      # history, which main's ruleset keeps from being rewritten, is named by its SHA alone: git
      # diff reads its tree from the history, and a checkout by a ref of the workflow_run event is
      # what Scorecard's Dangerous-Workflow flags (R12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      # spec's recipe release-version numbers the release, run by spec's script in the toolchain
      # stage, as spec's release runs it, with nothing of the step's environment. It
      # takes RELEASE_LINE as this file sets it at TARGET, the line the commit was made in; a commit
      # older than this file takes the tip's. TARGET has to be a full SHA in the history of the
      # checkout, which spec's recipe does not ask. A tag with no release behind it was pushed
      # by hand: as TARGET's release, the release before or the newest off main's history, it would
      # stop releases quietly, so the run stops on it instead.
      #
      # The core stage is all a release needs, and .github's toolchain adds nothing to it.
      - id: version
        name: Work out the version
        env:
          TOOLCHAIN_STAGE: toolchain-core
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The commit to release is not a full SHA: \"${TARGET}\"."
              exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              echo "::error::A shallow clone has no tags to count from: fetch the whole history."
              exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET" HEAD; then
              echo "::error::${TARGET} is not in the history of the checkout, $(git rev-parse HEAD)."
              exit 1
          fi
          # Every container the script starts has the folder it runs from mounted read-write, .git
          # and all, so the script runs from a copy of the checkout, in RUNNER_TEMP. The runner's
          # own git reads the checkout alone, which no container mounts: the diff below, the fetch
          # after a refusal and the post step of actions/checkout. Containers may change the copy,
          # so the script's sum is taken in the checkout and checked in the copy before each call
          # after a container: what runs on the runner is the script the tag holds.
          if [ ! -f spec/tools/toolchain/toolchain.sh ] || [ ! -x spec/tools/toolchain/toolchain.sh ]; then
              echo "::error::spec/ has no executable tools/toolchain/toolchain.sh, which spec ships from v0.2.17 (R31 spec): .github's spec submodule is older than that."
              exit 1
          fi
          toolchain_sum=$(sha256sum spec/tools/toolchain/toolchain.sh)
          cp -a . "$RUNNER_TEMP/checkout"
          (
              cd "$RUNNER_TEMP/checkout"
              spec/tools/toolchain/toolchain.sh build
              # release-refusal runs only after a refusal, which is rare, so a tag of spec that
              # renamed it or changed how many arguments it takes would show only then. just's dry
              # run asks here whether the publish step's call still parses; arguments that only
              # swapped places it cannot see.
              if ! spec/tools/toolchain/toolchain.sh spec --dry-run release-refusal \
                  "$TARGET" "$TARGET" "$RUNNER_TEMP/release-create.err" 2> "$RUNNER_TEMP/release-refusal"; then
                  cat "$RUNNER_TEMP/release-refusal" >&2
                  echo "::error::The dry run of spec's release-refusal, with the arguments the publish step gives it — the commit, the tip and the error file — failed; the lines above say why. A tag of spec whose recipe is gone or takes other arguments fails it."
                  exit 1
              fi
              if ! printf '%s\n' "$toolchain_sum" | sha256sum --check --strict --status; then
                  echo "::error::spec/tools/toolchain/toolchain.sh changed in the copy of the checkout while the release ran: something a container ran wrote into the copy. Nothing more runs from it."
                  exit 1
              fi
              spec/tools/toolchain/toolchain.sh spec release-version "$TARGET" .github/workflows/self-release.yml \
                  > "$RUNNER_TEMP/release-version"
          )
          cat "$RUNNER_TEMP/release-version"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release-version")
          previous=$(sed -n 's/^previous=//p' "$RUNNER_TEMP/release-version")
          released=$(sed -n 's/^released=//p' "$RUNNER_TEMP/release-version")
          behind=$(sed -n 's/^behind=//p' "$RUNNER_TEMP/release-version")
          for tag in $released $behind $previous; do
              if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null; then
                  echo "::error::${tag} has no release behind it: a tag pushed by hand. Tags come from this workflow alone (R04)."
                  exit 1
              fi
          done
          # What a release carries: the shared workflows, the shared actions, which callers pin as
          # they pin the workflows, and the tool go.yml builds of its own version. git
          # diff --quiet exits 1 on a change and 0 on none; anything else is its own failure.
          if [ -n "$version" ] && [ -n "$previous" ]; then
              changed=0
              git diff --quiet "$previous" "$TARGET" -- .github/workflows/ ':(exclude).github/workflows/self-*' .github/actions/ tools/coderules/ || changed=$?
              if [ "$changed" = 0 ]; then
                  echo "::notice::No shared workflow or action, nor the tool tools/coderules, has changed since ${previous}: nothing to release."
                  version=""
              elif [ "$changed" != 1 ]; then
                  echo "::error::git diff could not compare ${previous} with ${TARGET}."
                  exit 1
              fi
          fi
          if [ -n "$version" ]; then
              echo "releasing $version at $TARGET"
          elif [ -n "$released" ] || [ -n "$behind" ]; then
              echo "::notice::Nothing to publish: ${TARGET} is released already, or is older than the newest release."
          fi
          {
              echo "version=${version}"
              echo "previous=${previous}"
              echo "released=${released}"
          } >> "$GITHUB_OUTPUT"

      # Every release is marked Latest by its flag: none comes out below the newest one, and, unlike
      # spec's, the tip of main may get no release of its own. The Releases API refuses GITHUB_TOKEN
      # a commit that adds or modifies a file under .github/workflows/ relative to the default
      # branch, with 404 or 403: a commit that is no longer the tip then waits for the next release,
      # which covers it.
      - id: publish
        name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          if ! gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$VERSION" \
              --latest \
              --generate-notes "${start[@]}" 2> "$RUNNER_TEMP/release-create.err"; then
              cat "$RUNNER_TEMP/release-create.err" >&2
              # Only the documented refusal is let pass, as spec's release-refusal reads it.
              # main is fetched again: a commit merged meanwhile is what makes this one
              # older. The recipe runs in a new copy of the checkout, taken after the fetch: the
              # version step's copy has no new tip, and a fetch there would read a .git/config a
              # container may have changed. No container has had the checkout, so the new copy's
              # script is the one the tag holds.
              git fetch --quiet --no-tags --no-recurse-submodules origin refs/heads/main
              tip=$(git rev-parse FETCH_HEAD)
              cp -a . "$RUNNER_TEMP/checkout-tip"
              if ! (cd "$RUNNER_TEMP/checkout-tip" &&
                  spec/tools/toolchain/toolchain.sh spec release-refusal \
                      "$TARGET" "$tip" "$RUNNER_TEMP/release-create.err"); then
                  exit 1
              fi
              echo "::warning::${TARGET} is no longer the tip of main (${tip}) and adds or modifies its workflow files, and the Releases API refused it; the release of the tip covers it."
              exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The release is immutable and attested; the attestation may take a moment to appear. A
      # run again of a commit released already verifies its release, so that a run that failed
      # here does not turn green on a second try without it.
      - name: Verify the release
        if: steps.publish.outputs.published == 'true' || steps.version.outputs.released != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
        run: |
          for attempt in 1 2 3 4 5; do
              if gh release verify "$VERSION" --repo "$GITHUB_REPOSITORY"; then exit 0; fi
              echo "attempt $attempt: not verified yet"
              sleep 10
          done
          echo "::error::${VERSION} is published, but its attestation does not verify."
          exit 1
