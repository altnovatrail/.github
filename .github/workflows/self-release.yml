# .github's own release (R04, R10), as spec's (R31 in spec): what a green main produces when a
# shared workflow has changed. Nobody tags by hand: the version is the next patch of the line
# the releases are numbered in, and the tag is created with the release. The callers pin a
# shared workflow by the SHA of a release, with its version beside it (R04).
#
# A commit gets a release only when a shared workflow — a file of .github/workflows/ without the
# self- prefix — has changed since the release before it; the first release comes out always.
# A release of a profile, a community file, a self- workflow or a document would only bring
# every caller a pull request for a workflow that did not change (architecture 3.5).
#
# The releases are immutable, so the tag stays on its commit for good, and GitHub signs each
# release with an attestation of its tag and commit, which `gh release verify` checks.
#
# The button runs the same for the tip of main — after a release run that failed, say: it
# releases the tip when the tip has no release yet and a shared workflow has changed since the
# last one. It works on main alone, and only once CI has passed on that commit.
#
# The version is worked out on every green commit of main, released or not, so a change that
# breaks the step — a new tag of spec whose version.mjs no longer exports what it imports, say —
# turns this run red on the commit that brought it.

name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The line the releases are numbered in: the major and minor version every release carries, the
# patch counting up within it. The step that works out the version reads it from this file.
# Raising it releases nothing by itself: the new line starts with the next change to a shared
# workflow.
env:
  RELEASE_LINE: "0.1"

jobs:
  release:
    name: Release
    # Releases queue rather than overlap: each has to see the version the one before it
    # published before it can work out the next. queue: max keeps up to 100 runs pending, where
    # the default, single, keeps one (GitHub Docs, Workflow syntax, concurrency, read
    # 2026-10-20). actionlint does not know the key yet: .github/actionlint.yaml.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    # Only from a commit the checks have passed on, and only when that commit is this
    # repository's own: the branch filter above matches the name of a fork's branch as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # With pipefail: a runner's default, bash -e, would let a failed git ls-remote leave tip empty.
    defaults:
      run:
        shell: bash
    permissions:
      # Creating the release, and its tag with it.
      contents: write
      # Reading whether CI passed on the commit the button would release.
      actions: read
    steps:
      # Asked before anything of the repository is fetched: a run on another branch publishes
      # nothing, and neither does a commit whose CI on main has not finished green.
      - name: Whether this commit may be released by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release is published from main alone, and this run is on ${GITHUB_REF}."
              exit 1
          fi
          passed=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/self-ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f status=success \
              --jq '.total_count')
          if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed on ${GITHUB_SHA}. A release waits for its checks, and follows them by itself once they pass."
              exit 1
          fi

      # The commit the checks ran on, with every tag, and spec as its submodule: the next version
      # is counted from the tags, by spec's own functions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      # The number comes from readLine, readTags and nextVersion of spec/tools/release/version.mjs,
      # with this file's RELEASE_LINE: as a command, version.mjs would read spec's own line. The
      # tags are counted in the toolchain stage, as CI runs its checks, with the Node and git of
      # the devcontainer; the git diff against the release before runs with the runner's git, as
      # the shared checks do (R08). The step's outputs: version — empty when there is nothing to
      # release — previous, the release before, where the notes and the diff start, and
      # released, the release this commit has already. behind, the newest release when this
      # commit is older than it, is only checked here. A tag with no release behind it was
      # pushed by hand: on this commit, as the release before, or as the newest "release" off
      # main's history, it would stop releases quietly, so the run stops on it instead.
      - id: version
        name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-version.mjs" <<'SCRIPT'
          import fs from "node:fs";
          import { readLine, readTags, nextVersion } from "/work/spec/tools/release/version.mjs";
          const line = readLine(fs.readFileSync("/work/.github/workflows/self-release.yml", "utf8"));
          const result = nextVersion({ line, ...readTags(fs.readFileSync(0, "utf8")) });
          console.log(`version=${result.version}`);
          console.log(`previous=${result.previous ?? ""}`);
          console.log(`released=${result.released ?? ""}`);
          console.log(`behind=${result.behind ?? ""}`);
          SCRIPT
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/release-version.mjs:/release-version.mjs:ro" \
              --workdir /work toolchain bash -c '
                  set -euo pipefail
                  if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                      echo "a shallow clone has no tags to count from" >&2
                      exit 1
                  fi
                  {
                      git tag --list "v*"; echo --
                      git tag --merged HEAD --list "v*"; echo --
                      git tag --points-at HEAD --list "v*"
                  } | node /release-version.mjs' > "$RUNNER_TEMP/release-version"
          cat "$RUNNER_TEMP/release-version"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release-version")
          previous=$(sed -n 's/^previous=//p' "$RUNNER_TEMP/release-version")
          released=$(sed -n 's/^released=//p' "$RUNNER_TEMP/release-version")
          behind=$(sed -n 's/^behind=//p' "$RUNNER_TEMP/release-version")
          for tag in $released $behind $previous; do
              if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null; then
                  echo "::error::${tag} has no release behind it: a tag pushed by hand. Tags come from this workflow alone (R04)."
                  exit 1
              fi
          done
          # A shared workflow is a file of .github/workflows/ without the self- prefix. A file
          # that a shared workflow comes to read from .github joins this list with it. git diff
          # --quiet exits 1 on a change and 0 on none; anything else is its own failure.
          if [ -n "$version" ] && [ -n "$previous" ]; then
              changed=0
              git diff --quiet "$previous" HEAD -- .github/workflows/ ':(exclude).github/workflows/self-*' || changed=$?
              if [ "$changed" = 0 ]; then
                  echo "::notice::No shared workflow has changed since ${previous}: nothing to release."
                  version=""
              elif [ "$changed" != 1 ]; then
                  echo "::error::git diff could not compare ${previous} with this commit."
                  exit 1
              fi
          fi
          if [ -n "$version" ]; then
              echo "releasing $version"
          elif [ -n "$released" ] || [ -n "$behind" ]; then
              echo "::notice::Nothing to publish: this commit is released already, or is older than the newest release."
          fi
          {
              echo "version=${version}"
              echo "previous=${previous}"
              echo "released=${released}"
          } >> "$GITHUB_OUTPUT"

      # Every release is marked Latest: its number is the highest so far, since a release never
      # comes out below the newest one, and, unlike spec's, the tip of main may get no release of
      # its own when it changes no shared workflow. The notes run from the release before this
      # one. The Releases API refuses GITHUB_TOKEN a commit whose workflow files differ from
      # main's, with 404 or, on some paths, 403 "Resource not accessible by integration"
      # (GitHub Docs, REST releases, read 2026-10-20): a commit that is no longer the tip then
      # waits for the next release, which covers it, since the change it brought is still there
      # since the release before.
      - id: publish
        name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          if ! gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$VERSION" \
              --latest \
              --generate-notes "${start[@]}" 2> "$RUNNER_TEMP/release-create.err"; then
              cat "$RUNNER_TEMP/release-create.err" >&2
              # Only the documented refusal of an older commit is let pass; anything else fails.
              # The tip is read after the refusal: a commit merged meanwhile is what makes it one.
              tip=$(git ls-remote origin refs/heads/main | cut -f1)
              if [ -z "$tip" ] || [ "$tip" = "$TARGET" ] || ! grep -qE 'HTTP 404|HTTP 403: Resource not accessible by integration' "$RUNNER_TEMP/release-create.err"; then exit 1; fi
              echo "::warning::${TARGET} is no longer the tip of main (${tip}), and the Releases API refused it; the release of the tip covers it."
              exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The release is immutable and attested; the attestation may take a moment to appear. A
      # run again of a commit released already verifies its release, so that a run that failed
      # here does not turn green on a second try without it.
      - name: Verify the release
        if: steps.publish.outputs.published == 'true' || steps.version.outputs.released != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
        run: |
          for attempt in 1 2 3 4 5; do
              if gh release verify "$VERSION" --repo "$GITHUB_REPOSITORY"; then exit 0; fi
              echo "attempt $attempt: not verified yet"
              sleep 10
          done
          echo "::error::${VERSION} is published, but its attestation does not verify."
          exit 1
