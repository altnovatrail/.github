# Shared check (R03, R19): the TypeScript code of the repository that calls it, by four recipes of
# that repository's own — ci-lint, ci-test, ci-vuln and ci-licenses — one job each, in the
# toolchain stage of the caller's .devcontainer/Dockerfile, where the caller pins its Node and the
# browsers its tests run in; the recipes pin the versions of the tools they run and install the
# packages of the lock file themselves. What the checks do is the repository's; how they are run
# is the same everywhere (R30 in spec). Each job is a check of the caller's ruleset of main:
# "TypeScript / lint", "TypeScript / test", "TypeScript / vuln" and "TypeScript / licenses", when
# the calling job is named TypeScript.
#
# ci-test writes the coverage of the tests as an lcov report, coverage/lcov.info, and the job
# coverage sends it to Codecov by OIDC, with no secret (R48 in spec). "TypeScript / coverage" is no
# check of the ruleset: codecov/patch, which Codecov sets from the upload, is.
#
# ci-licenses checks every package of the lock file by spec's recipe licenses-check-repo, from the
# caller's spec submodule, with the repository's own exceptions: the list and the rule of an
# exception are spec's, at the tag the caller pins (R39 in spec). That is why the licenses job
# alone checks the submodule out: there it is the tool of the check, while the code and its tests
# read nothing of spec/. So this file carries no copy of the list: its callers take the list from
# spec. go.yml keeps one, since spec has no recipe to check Go by. A repository's exceptions are
# its own, each with its decision.
#
# Each job that runs in the toolchain stage takes its image from the caller's cache of GitHub
# Actions, so that an outage of what the Dockerfile downloads from does not fail the checks while
# the Dockerfile stays the same (R36). On a miss the job toolchain alone builds it and hands it on
# to the others by an artifact of the run, and a push to main alone saves it (R42).
#
# There is no TypeScript code in .github, so a change here is tried by a trial pull request of
# .github that calls this file by local path and is never merged, before the release (R19). The
# first trial, #40, keeps its commits at refs/pull/40/head: a new trial starts from them.
# Called from a job that gives it `contents: read` and `id-token: write`: the coverage job alone
# asks for the token, and a called workflow can only lower what its caller gives.

name: TypeScript (shared)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The image of the toolchain stage of the caller's .devcontainer/Dockerfile, built at most once
  # for the jobs of this file that run on amd64 (R36, R42). It comes from the caller's cache of
  # GitHub Actions, as spec decided for the stage in CI and canvas does (the amendment of 2026-11-09
  # to R31 in spec; R57 canvas): a file of docker save, by the key of the runner's OS and
  # architecture and the hash of the Dockerfile. The Dockerfile pins everything it installs, by
  # version and sum (R34, R40 in spec), so the image from the cache is the one it would build, and
  # on a hit it does not run: nodejs.org, GitHub and the snapshot of Ubuntu's archive are not asked.
  # On a hit this job only looks the entry up, and each job after it restores the file. On a miss
  # it builds the image alone and hands the file to the jobs after it as an artifact of the run,
  # kept a day and compressed fast. Only a push to main saves the file into the cache: an entry of a
  # pull request is "restored by re-runs of the pull request" alone, and the one of main, which
  # every pull request reads, its CI on a push to main saves. The path and the image's name are
  # those of spec's toolchain.sh, by which documents.yml and spec's CI build the stage, so that a
  # caller keeps one entry for all of them ("Cache Version" in the README of actions/cache); a
  # change to how the image is built takes a new path in all of them at once. The file lies
  # outside the checkout, where the recipes do not see it, and the Dockerfile copies nothing from
  # the repository, so it is built without a context. A build or an upload that fails here fails
  # no check: the jobs after this one build the image themselves, and fail with the build when the
  # Dockerfile is broken.
  toolchain:
    name: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      # The artifact the jobs after this one download, or nothing when there is none.
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
          lookup-only: true

      - name: Toolchain image
        id: image
        if: steps.toolchain.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          SAVE: "true"
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage, from the cache or from the job toolchain, does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A cache entry that gives such a file is hit on every run until it is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.image.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Toolchain image for the jobs after this one
        id: upload
        if: steps.image.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-toolchain-image
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          retention-days: 1
          compression-level: 1
          overwrite: true
          if-no-files-found: ignore

  check:
    # Named after the check, so that each reads "<calling job> / <check>": "TypeScript / lint" for
    # ci-lint.
    name: ${{ matrix.check }}
    needs: toolchain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every check reports on its own, rather than the first one to fail cancelling the rest.
      fail-fast: false
      matrix:
        check: [lint, test, vuln, licenses]
    steps:
      # Without the spec submodule, but for the licenses job: code takes spec's files from spec's
      # releases, not from the submodule (R21 in spec), so a check that reads spec/ fails here as
      # it would for a user. The licenses job gets the submodule at the commit the caller pins, for
      # ci-licenses to run spec's recipe from it (R39 in spec).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ matrix.check == 'licenses' }}
          persist-credentials: false

      # The image of the toolchain stage, from the caller's cache of GitHub Actions, or on a miss
      # from the job toolchain, which built it once for the jobs of this run (R36, R42). With
      # neither, or with a file that does not load as the image novatrail-toolchain, the step builds
      # the image itself, so that what failed there costs the run its speed, not its verdict. It
      # writes no file: the job toolchain saves the image. The browsers for the tests come with the
      # stage (R19).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image from the job toolchain
        if: steps.toolchain.outputs.cache-hit != 'true' && needs.toolchain.outputs.artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.toolchain.outputs.artifact }}
          path: ${{ runner.temp }}

      - name: Toolchain image
        env:
          SAVE: "false"
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage, from the cache or from the job toolchain, does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A cache entry that gives such a file is hit on every run until it is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      # As in go.yml, the container runs as the runner's user, with its home in /tmp, and it has
      # the network npm ci and npm audit need. Playwright recommends --init for any container and
      # --ipc=host for Chromium (R19); the latter only the test job gets, where a browser runs, so
      # the checks that start none keep Docker's own IPC namespace. Of the step's environment only
      # CI goes in. CI, which GitHub sets to true on every runner, is how the tools learn they run
      # in CI: by it Vitest runs its browser headless and refuses test.only.
      - name: ci-${{ matrix.check }}
        env:
          RECIPE: ci-${{ matrix.check }}
        run: |
          ipc=()
          if [ "$RECIPE" = ci-test ]; then ipc=(--ipc=host); fi
          docker run --rm --init "${ipc[@]}" --user "$(id -u):$(id -g)" \
              --env HOME=/tmp --env CI \
              --volume "$PWD:/work" --workdir /work \
              novatrail-toolchain just "$RECIPE"

      # The test job hands the report its recipe wrote to the coverage job, the one job that may ask
      # for an OIDC token: this one runs the code under test. A recipe that wrote none fails
      # "TypeScript / test", as it owes one (R19). The report is kept a week, so that the coverage
      # job can be run again after an outage of Codecov. The name is the wrapper's own: an
      # artifact's name is unique in a run, and the caller's own jobs may upload one called
      # coverage, as spec's do.
      - name: Coverage report
        if: matrix.check == 'test'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  # Codecov takes the report by OIDC, with no secret (R48 in spec). This job alone may ask GitHub for
  # the token, which only Codecov accepts and which grants nothing in the repository, and it runs
  # none of the repository's code. A pull request from a fork gets no token: the action then sends
  # the report without one, as Codecov takes it from a fork's branch. The job waits for every check,
  # as spec's upload does: a red one holds the merge anyway.
  #
  # Any failure of the job fails a pull request, so that a missing codecov/patch has its reason in
  # sight. Elsewhere, on main, it does not fail the run: the caller's release waits for CI to pass,
  # and an outage of Codecov must not hold it back.
  coverage:
    name: coverage
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # The files of the commit, which the upload lists so that Codecov can match the report's paths
      # to them; without the spec submodule, as the checks. Which commit and pull request the report
      # is for, the action takes from the event.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-coverage
          path: coverage

      # The Codecov CLI at an exact version, checked against its SHA-256 here, as the tools of
      # self-ci.yml are (R08), rather than against a key the action would fetch during the run. The
      # sum is the one the release's codecov.SHA256SUM gives, whose signature checks against the key
      # Codecov's docs name by its fingerprint. Dependabot moves the actions' SHAs alone: the
      # version and its sum are raised by hand, together, and in go.yml too.
      - name: Codecov CLI
        env:
          CLI_VERSION: v11.3.2
          CLI_SHA256: 8e1bfb71661378530f6ea21e82b414095899e565cbb4cf555c613064be17b973
        run: |
          cli="$RUNNER_TEMP/codecov"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$cli" "https://cli.codecov.io/${CLI_VERSION}/linux/codecov"
          echo "${CLI_SHA256}  ${cli}" | sha256sum --check --strict
          chmod +x "$cli"

      # The one report alone: no search for others, and no plugins, which would run coverage tools
      # of their own. A failed upload fails the job, as any of its steps does.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          plugins: noop
          disable_telem: true
          fail_ci_if_error: true
