# Shared check (R03, R19): the TypeScript code of the repository that calls it, by four recipes of
# that repository's own — ci-lint, ci-test, ci-vuln and ci-licenses — one job each, in the
# toolchain stage of the caller's .devcontainer/Dockerfile, where the caller pins its Node and the
# browsers its tests run in; the recipes pin the versions of the tools they run and install the
# packages of the lock file themselves. What the checks do is the repository's; how they are run
# is the same everywhere (R30 in spec). Each job is a check of the caller's ruleset of main:
# "TypeScript / lint", "TypeScript / test", "TypeScript / vuln" and "TypeScript / licenses", when
# the calling job is named TypeScript.
#
# ci-licenses checks every package of the lock file by spec's recipe licenses-check-repo, from the
# caller's spec submodule, with the repository's own exceptions: the list and the rule of an
# exception are spec's, at the tag the caller pins (R39 in spec). That is why the licenses job
# alone checks the submodule out: there it is the tool of the check, while the code and its tests
# read nothing of spec/. So this file carries no copy of the list: its callers take the list from
# spec. go.yml keeps one, since spec has no recipe to check Go by. A repository's exceptions are
# its own, each with its decision.
#
# There is no TypeScript code in .github, so a change here is tried by a trial pull request of
# .github that calls this file by local path and is never merged, before the release (R19). The
# first trial, #40, keeps its commits at refs/pull/40/head: a new trial starts from them.
# Called from a job that gives it `contents: read`.

name: TypeScript (shared)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # Named after the check, so that each reads "<calling job> / <check>": "TypeScript / lint" for
    # ci-lint.
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every check reports on its own, rather than the first one to fail cancelling the rest.
      fail-fast: false
      matrix:
        check: [lint, test, vuln, licenses]
    steps:
      # Without the spec submodule, but for the licenses job: code takes spec's files from spec's
      # releases, not from the submodule (R21 in spec), so a check that reads spec/ fails here as
      # it would for a user. The licenses job gets the submodule at the commit the caller pins, for
      # ci-licenses to run spec's recipe from it (R39 in spec).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ matrix.check == 'licenses' }}
          persist-credentials: false

      # The Dockerfile copies nothing from the repository, so it is built without a context, as
      # documents.yml builds it. The browsers for the tests come with the stage (R19).
      - name: Toolchain image
        run: docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile

      # As in go.yml, the container runs as the runner's user, with its home in /tmp, and it has
      # the network npm ci and npm audit need. Playwright recommends --init for any container and
      # --ipc=host for Chromium (R19); the latter only the test job gets, where a browser runs, so
      # the checks that start none keep Docker's own IPC namespace. Of the step's environment only
      # CI goes in. CI, which GitHub sets to true on every runner, is how the tools learn they run
      # in CI: by it Vitest runs its browser headless and refuses test.only.
      - name: ci-${{ matrix.check }}
        env:
          RECIPE: ci-${{ matrix.check }}
        run: |
          ipc=()
          ipc=(--ipc=host)
          docker run --rm --init "${ipc[@]}" --user "$(id -u):$(id -g)" \
              --env HOME=/tmp --env CI \
              --volume "$PWD:/work" --workdir /work \
              toolchain just "$RECIPE"
