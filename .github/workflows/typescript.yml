# Shared check: the caller's TypeScript code by four recipes of its own — ci-lint,
# ci-test, ci-vuln and ci-licenses —, a job each, in the toolchain stage of its
# .devcontainer/Dockerfile, where the caller pins its Node and the browsers its tests run in; the
# recipes pin the tools they run and install the packages of the lock file themselves. What the
# checks do is the caller's; how they are run is the same everywhere. With the calling
# job named TypeScript, the checks of the caller's ruleset are "TypeScript / lint",
# "TypeScript / test", "TypeScript / vuln" and "TypeScript / licenses".
#
# With engines, a fifth job runs the caller's recipe ci-engines, the tests in WebKit and Firefox,
# as the check "TypeScript / engines", while ci-test runs them in Node and Chromium with the
# coverage, so that the two take their time side by side. The three browsers are those of the
# toolchain stage of spec's kind typescript.
#
# ci-test writes its coverage to coverage/lcov.info, which the job coverage sends to Codecov by
# OIDC, with no secret. "TypeScript / coverage" is no check of the ruleset:
# codecov/patch, which Codecov sets from the upload, is.
#
# ci-licenses checks every package of the lock file by spec's recipe licenses-check-repo from the
# caller's spec submodule, with the caller's own exceptions, each with its decision: the list and
# the rule of an exception are spec's, at the tag the caller pins. So the licenses job
# alone checks the submodule out, as the tool of its check, and this file carries no copy of the
# list; go.yml keeps one, since spec has no recipe to check Go by.
#
# The image of the toolchain stage comes from the caller's cache of GitHub Actions, so that an
# outage of what the Dockerfile downloads from fails no check while the Dockerfile stays the same:
# on a miss the job toolchain alone builds it and hands it on by an artifact of the run, and
# a push to main alone saves it. lint, vuln and licenses, which start no browser and run no
# test, run in the smaller stage toolchain-core where the Dockerfile has one.
#
# .github has no TypeScript code, so a change here is tried before its release by a trial pull
# request of .github that calls this file by local path and is never merged; refs/pull/40/head
# keeps the commits of the first trial to start from.
#
# Called from a job that gives it `contents: read` and `id-token: write`: the job coverage alone
# asks for the token, and a called workflow can only lower what its caller gives.

name: TypeScript (shared)

on:
  workflow_call:
    inputs:
      engines:
        description: Run the tests in WebKit and Firefox by the recipe ci-engines, as the check "TypeScript / engines" (R19).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The image of the caller's toolchain stage, built at most once for the jobs of this file on
  # amd64: a file of docker save in the caller's cache of GitHub Actions, by the key of
  # the runner's OS and architecture and the hash of the Dockerfile. The Dockerfile pins
  # all it installs by version and sum, so the image from the cache is the one
  # it would build, and a hit asks nothing of nodejs.org, GitHub or Ubuntu's snapshot. On a hit this
  # job only looks the entry up, and each job after it restores the file; on a miss it builds the
  # image and hands the file on as an artifact of the run, kept a day. Only a push to main saves: a
  # pull request's entry would serve its own re-runs alone, and main's serves every pull request.
  # The path and the image's name are those of spec's toolchain.sh, by which documents.yml and
  # spec's CI build the stage, so that a caller keeps one entry for all of them, and a change to how
  # the image is built takes a new path in all of them at once. The Dockerfile copies nothing from
  # the repository, so it is built without a context. A build or an upload that fails here fails no
  # check: the jobs after this one build the image themselves.
  #
  # lint, vuln and licenses run in the stage toolchain-core where the Dockerfile has one that holds
  # less than toolchain, with a file, an entry and an artifact of its own,
  # novatrail-toolchain-core.tar by the key toolchain-core-…; on a miss of both this job builds and
  # hands on both.
  toolchain:
    name: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      # The stage of lint, vuln and licenses, toolchain-core or toolchain, and the artifact of each
      # stage that the jobs after this one download, or nothing when there is none.
      core: ${{ steps.stages.outputs.core }}
      toolchain: ${{ steps.upload.outputs.artifact-id }}
      toolchain-core: ${{ steps.upload-core.outputs.artifact-id }}
    steps:
      # The Dockerfile alone, which the key hashes and the build reads: a sparse checkout fetches
      # no other file of the caller's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .devcontainer/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # toolchain-core where the Dockerfile has that stage, as spec's toolchain.sh finds it, and its
      # stage toolchain holds more: an instruction but SHELL, or another base. Else toolchain, which
      # holds all the core does, since a second entry of the same files would cost space alone.
      # A continued line counts as one instruction, so a reading that errs gives the core a
      # file of its own, which costs an entry and no verdict.
      - name: Toolchain stages
        id: stages
        run: |
          core=toolchain
          if [ -f .devcontainer/Dockerfile ] && awk '
              { sub(/\r$/, "") }
              /^[[:space:]]*(#|$)/ { next }
              toupper($1) == "FROM" {
                  stage = (NF >= 4 && toupper($(NF - 1)) == "AS") ? tolower($NF) : ""
                  if (stage == "toolchain-core") core = 1
                  if (stage == "toolchain" && tolower($(NF - 2)) != "toolchain-core") adds = 1
                  next
              }
              stage == "toolchain" && toupper($1) != "SHELL" { adds = 1 }
              END { exit !(core && adds) }
          ' .devcontainer/Dockerfile; then
              core=toolchain-core
          fi
          echo "The checks without a browser run in the stage ${core}."
          echo "core=${core}" >> "$GITHUB_OUTPUT"

      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
          lookup-only: true

      - name: Core image from the cache
        id: core
        if: steps.stages.outputs.core == 'toolchain-core'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          key: toolchain-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
          lookup-only: true

      # The stages whose entry missed, toolchain first.
      - name: Toolchain image
        id: image
        if: steps.toolchain.outputs.cache-hit != 'true' || (steps.stages.outputs.core == 'toolchain-core' && steps.core.outputs.cache-hit != 'true')
        continue-on-error: true
        env:
          SAVE: "true"
          STAGES: ${{ steps.toolchain.outputs.cache-hit != 'true' && 'toolchain' || '' }} ${{ steps.stages.outputs.core == 'toolchain-core' && steps.core.outputs.cache-hit != 'true' && 'toolchain-core' || '' }}
        run: |
          # Each stage STAGES names, from its own file, novatrail-<stage>.tar, and as the one image
          # novatrail-toolchain, as spec's toolchain.sh names either stage: the job toolchain
          # builds and saves one, then the other, and every other job takes one.
          for stage in $STAGES; do
              case $stage in
                  toolchain | toolchain-core) ;;
                  *)
                      echo "::error::STAGES names ${stage}, which is neither toolchain nor toolchain-core."
                      exit 1
                      ;;
              esac
              tar=$RUNNER_TEMP/novatrail-$stage.tar
              restored=false
              if [ -f "$tar" ]; then
                  restored=true
                  if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                      rm -f -- "$tar"
                      echo "Toolchain image: ${stage} loaded from its file."
                      continue
                  fi
                  echo "::warning::The file of the ${stage} stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
                  rm -f -- "$tar"
              fi
              docker build --target "$stage" --tag novatrail-toolchain - < .devcontainer/Dockerfile
              # Only a job that saves writes the file. A file that came has its entry or its artifact
              # already, which no save replaces.
              if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
                  echo "::warning::The image of the ${stage} stage could not be saved: the jobs after this one and the next run build it again."
                  rm -f -- "$tar"
              fi
          done

      - name: Toolchain image into the cache
        if: steps.image.outcome == 'success' && steps.toolchain.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Core image into the cache
        if: steps.image.outcome == 'success' && steps.stages.outputs.core == 'toolchain-core' && steps.core.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          key: ${{ steps.core.outputs.cache-primary-key }}

      # A stage whose entry was found has no file here, and gives no artifact.
      - name: Toolchain image for the jobs after this one
        id: upload
        if: steps.image.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-toolchain-image
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          retention-days: 1
          compression-level: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Core image for the jobs after this one
        id: upload-core
        if: steps.image.outcome == 'success' && steps.stages.outputs.core == 'toolchain-core'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-toolchain-core-image
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          retention-days: 1
          compression-level: 1
          overwrite: true
          if-no-files-found: ignore

  check:
    # Named after the check, so that each reads "<calling job> / <check>": "TypeScript / lint" for
    # ci-lint. The check engines is in the matrix with the input alone.
    name: ${{ matrix.check }}
    needs: toolchain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every check reports on its own, rather than the first one to fail cancelling the rest.
      fail-fast: false
      matrix:
        check: ${{ fromJSON(inputs.engines && '["lint", "test", "engines", "vuln", "licenses"]' || '["lint", "test", "vuln", "licenses"]') }}
    steps:
      # Without the spec submodule, but for the licenses job: code takes spec's files from spec's
      # releases, not from the submodule, so a check that reads spec/ fails here as it
      # would for a user. The licenses job gets the submodule at the commit the caller pins, for
      # ci-licenses to run spec's recipe from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ matrix.check == 'licenses' }}
          persist-credentials: false

      # The stage of this check: lint, vuln and licenses, which start no browser and run no
      # test, take the one the job toolchain names for them, and the rest toolchain. Without a name
      # from that job, which then failed before it had one, toolchain, which holds all the core does.
      - name: Toolchain stage
        id: stage
        env:
          CHECK: ${{ matrix.check }}
          CORE: ${{ needs.toolchain.outputs.core }}
        run: |
          stage=toolchain
          case $CHECK in
              lint | vuln | licenses) [ "$CORE" != toolchain-core ] || stage=toolchain-core ;;
          esac
          echo "ci-${CHECK} runs in the stage ${stage}."
          echo "stage=${stage}" >> "$GITHUB_OUTPUT"

      # The image of that stage, from the caller's cache of GitHub Actions, or on a miss
      # from the job toolchain, which built it once for the jobs of this run. With
      # neither, or with a file that does not load as the image novatrail-toolchain, the step builds
      # the image itself, so that what failed there costs the run its speed, not its verdict. It
      # writes no file: the job toolchain saves the image. The browsers for the tests come with the
      # stage toolchain.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-${{ steps.stage.outputs.stage }}.tar
          key: ${{ steps.stage.outputs.stage }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image from the job toolchain
        if: steps.toolchain.outputs.cache-hit != 'true' && needs.toolchain.outputs[steps.stage.outputs.stage] != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.toolchain.outputs[steps.stage.outputs.stage] }}
          path: ${{ runner.temp }}

      - name: Toolchain image
        env:
          SAVE: "false"
          STAGES: ${{ steps.stage.outputs.stage }}
        run: |
          # Each stage STAGES names, from its own file, novatrail-<stage>.tar, and as the one image
          # novatrail-toolchain, as spec's toolchain.sh names either stage: the job toolchain
          # builds and saves one, then the other, and every other job takes one.
          for stage in $STAGES; do
              case $stage in
                  toolchain | toolchain-core) ;;
                  *)
                      echo "::error::STAGES names ${stage}, which is neither toolchain nor toolchain-core."
                      exit 1
                      ;;
              esac
              tar=$RUNNER_TEMP/novatrail-$stage.tar
              restored=false
              if [ -f "$tar" ]; then
                  restored=true
                  if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                      rm -f -- "$tar"
                      echo "Toolchain image: ${stage} loaded from its file."
                      continue
                  fi
                  echo "::warning::The file of the ${stage} stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
                  rm -f -- "$tar"
              fi
              docker build --target "$stage" --tag novatrail-toolchain - < .devcontainer/Dockerfile
              # Only a job that saves writes the file. A file that came has its entry or its artifact
              # already, which no save replaces.
              if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
                  echo "::warning::The image of the ${stage} stage could not be saved: the jobs after this one and the next run build it again."
                  rm -f -- "$tar"
              fi
          done

      # As in go.yml, the container runs as the runner's user, with its home in /tmp, and it has
      # the network npm ci and npm audit need. Playwright recommends --init for any container and
      # --ipc=host for Chromium (R19): only the jobs test and engines, where the browsers run, get
      # the latter, and the checks that start none keep Docker's own IPC namespace. WebKit and
      # Firefox get it too: without engines, ci-test runs them beside Chromium, and with it they
      # keep the flags they run under there. Of the step's environment only CI goes in, which
      # GitHub sets to true on every runner: by it Vitest runs its browser headless and refuses
      # test.only.
      - name: ci-${{ matrix.check }}
        env:
          RECIPE: ci-${{ matrix.check }}
        run: |
          ipc=()
          case "$RECIPE" in ci-test | ci-engines) ipc=(--ipc=host) ;; esac
          docker run --rm --init "${ipc[@]}" --user "$(id -u):$(id -g)" \
              --env HOME=/tmp --env CI \
              --volume "$PWD:/work" --workdir /work \
              novatrail-toolchain just "$RECIPE"

      # The test job hands the report its recipe wrote to the coverage job, the one job that may ask
      # for an OIDC token: this one runs the code under test. A recipe that wrote none fails
      # "TypeScript / test", as it owes one. The report is kept a week, so that the coverage
      # job can be run again after an outage of Codecov. The name is the wrapper's own: an
      # artifact's name is unique in a run, and the caller's own jobs may upload one called
      # coverage, as spec's do.
      - name: Coverage report
        if: matrix.check == 'test'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  # Codecov takes the report by OIDC, with no secret. This job alone may ask GitHub for
  # the token, which only Codecov accepts and which grants nothing in the repository, and it runs
  # none of the repository's code. A pull request from a fork gets no token: the action then sends
  # the report without one, as Codecov takes it from a fork's branch. The job waits for every check,
  # as spec's upload does: a red one holds the merge anyway.
  #
  # Any failure of the job fails a pull request, so that a missing codecov/patch has its reason in
  # sight. Elsewhere, on main, it does not fail the run: the caller's release waits for CI to pass,
  # and an outage of Codecov must not hold it back.
  coverage:
    name: coverage
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # The files of the commit, which the upload lists so that Codecov can match the report's paths
      # to them; without the spec submodule, as the checks. Which commit and pull request the report
      # is for, the action takes from the event.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-coverage
          path: coverage

      # The Codecov CLI at an exact version, checked against its SHA-256 here, as the tools of
      # self-ci.yml are, rather than against a key the action would fetch during the run. The
      # sum is the one the release's codecov.SHA256SUM gives, whose signature checks against the key
      # Codecov's docs name by its fingerprint. Dependabot moves the actions' SHAs alone: the
      # version and its sum are raised by hand, together, and in go.yml too.
      - name: Codecov CLI
        env:
          CLI_VERSION: v11.3.2
          CLI_SHA256: 8e1bfb71661378530f6ea21e82b414095899e565cbb4cf555c613064be17b973
        run: |
          cli="$RUNNER_TEMP/codecov"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$cli" "https://cli.codecov.io/${CLI_VERSION}/linux/codecov"
          echo "${CLI_SHA256}  ${cli}" | sha256sum --check --strict
          chmod +x "$cli"

      # The one report alone: no search for others, and no plugins, which would run coverage tools
      # of their own. A failed upload fails the job, as any of its steps does.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          plugins: noop
          disable_telem: true
          fail_ci_if_error: true
