# Shared check: every commit of a pull request, merge commits aside, carries a
# Signed-off-by line of its author, the Developer Certificate of Origin that every contribution
# certifies. The commits come from git, so the check needs no API and nothing
# beyond `contents: read`.
#
# The range is the two parents of the merge checkout, not the event's payload, so a run again
# after the base moved still reads only the pull request's own commits.
#
# The sign-off names the author exactly, by name and address; the key is matched as git matches
# trailers, whatever its case. Dependabot authors its commits as dependabot[bot] at its noreply
# address but signs them off as dependabot[bot] <support@github.com>, and GitHub commits them: that
# line counts only when the commit's author is Dependabot, its committer GitHub and the pull
# request's author dependabot[bot], since an author is a string anyone can set and the pull
# request's author is not. Commits made on github.com carry their sign-off because the
# organization requires it for web-based commits.
#
# Called from a job that runs on pull_request only: on any other event there are no commits of a
# pull request to read, and the check fails rather than pass with nothing checked.

name: DCO (shared)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sign-off:
    name: sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole history, so that both parents of the merge and every commit between them are
      # there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit is signed off by its author
        env:
          PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPENDABOT_AUTHOR: dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>
          DEPENDABOT_COMMITTER: GitHub <noreply@github.com>
          DEPENDABOT_SIGNOFF: dependabot[bot] <support@github.com>
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
              echo "::error::The DCO check reads the commits of a pull request, and this run (${GITHUB_EVENT_NAME}) has none."
              exit 1
          fi
          # Listed first, on its own: a git that fails here stops the step.
          commits="$(git rev-list --no-merges 'HEAD^1..HEAD^2')"
          failed=0
          while read -r commit; do
              [ -n "$commit" ] || continue
              author="$(git log -1 --format='%an <%ae>' "$commit")"
              committer="$(git log -1 --format='%cn <%ce>' "$commit")"
              expected="$author"
              if [ "$PULL_REQUEST_AUTHOR" = 'dependabot[bot]' ] && [ "$author" = "$DEPENDABOT_AUTHOR" ] && [ "$committer" = "$DEPENDABOT_COMMITTER" ]; then
                  expected="$DEPENDABOT_SIGNOFF"
              fi
              if git log -1 --format='%(trailers:key=Signed-off-by,valueonly,unfold)' "$commit" | grep -qxF "$expected"; then
                  echo "signed off: ${commit}"
              else
                  echo "::error::${commit} ($(git log -1 --format=%s "$commit")) has no line 'Signed-off-by: ${expected}'. Sign it off with git commit -s, as CONTRIBUTING.md says."
                  failed=1
              fi
          done <<< "$commits"
          exit "$failed"
