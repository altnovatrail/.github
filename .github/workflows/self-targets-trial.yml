# Trial (T62, never merged): the shared go.yml with same-bits, called by local path from this pull
# request, on the trial module of T60 at the root: the targets as a matrix and "Go / targets" after
# them, and the targets of fma-diff at once (R43).
name: Targets trial

on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/go.yml
    with:
      same-bits: true
