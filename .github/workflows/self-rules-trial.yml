# Trial (T48, never merged): the shared go.yml with same-bits, called by local path from this pull
# request, on the trial module at the root and its lists, "Go / rules" among the rest (R33).
name: Rules trial

on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/go.yml
    with:
      same-bits: true
