# CodeQL over .github itself (R03): the shared codeql.yml, called by local path, so that a pull
# request checks the version it changes. Beside its workflows, .github's own code is one Go
# module, the tool of the rules of code, tools/coderules, so it names go besides actions (R33). The
# checks CodeQL / analyze (actions) and CodeQL / analyze (go) hold the merge into main through
# main's ruleset (R11).
#
# No weekly run: the CodeQL bundle comes with the pinned action (tools: linked), so a run on
# unchanged code would find what the last one found. New queries come with the pull request
# that moves the action, and CodeQL runs on it.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    # Beside the workflows, .github's Go code, the tool tools/coderules (R33).
    with:
      languages: go
