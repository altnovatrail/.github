# CodeQL over .github itself (R03): the shared codeql.yml, called by local path, so that a pull
# request checks the version it changes. .github has no code of its own beyond its workflows, so
# it names no language besides actions. The check CodeQL / analyze (actions) holds the merge into
# main through main's ruleset (R11).
#
# No weekly run: the CodeQL bundle comes with the pinned action (tools: linked), so a run on
# unchanged code would find what the last one found. New queries come with the pull request
# that moves the action, and CodeQL runs on it.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
