# SonarQube Cloud's automatic analysis of .github, whose quality gate holds the merge
# into main through main's ruleset. The spec/ submodule is spec's code and spec's to analyse.
sonar.exclusions=spec/**
# The controls of tools/coderules/testdata/ are near copies of each other on purpose: each breaks
# every rule by the lists of the repository it came from.
sonar.cpd.exclusions=tools/coderules/testdata/**
