# SonarQube Cloud's automatic analysis of .github (R30 spec), whose quality gate holds the merge
# into main through main's ruleset (R11). The spec/ submodule is spec's code and spec's to analyse.
sonar.exclusions=spec/**
# The controls of tools/coderules/testdata/ are near copies of each other on purpose: each breaks
# every rule by the lists of the repository it came from (R33).
sonar.cpd.exclusions=tools/coderules/testdata/**
