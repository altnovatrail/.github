# SonarQube Cloud's automatic analysis of .github (R30 in spec). Its quality gate holds the merge
# into main through main's ruleset (R11). Left out: the spec/ submodule, which is
# spec's code and spec's to analyse (Д7 in spec's RUN.md).
sonar.exclusions=spec/**
# Left out of the search for duplicated code alone: the controls of the tool of the rules of code,
# tools/coderules/testdata/, learner-model's and engine's, which are near copies of each other on
# purpose — each breaks every rule by the lists of the repository it came from (R33).
sonar.cpd.exclusions=tools/coderules/testdata/**
